services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: assent_compliance
      POSTGRES_USER: assent
      POSTGRES_PASSWORD: assent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assent -d assent_compliance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
