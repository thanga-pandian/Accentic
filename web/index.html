<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Accentic · Regulatory Compliance Intelligence</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236200ad'/%3E%3Cstop offset='1' stop-color='%23b24bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7.2' y='16.3' width='17.6' height='5' rx='2.5' fill='%23ffc83d' transform='rotate(-8 16 18.8)'/%3E%3Cpath d='M9.1 24.4 16 8l6.9 16.4' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#6200ad">
<meta name="description" content="Accentic: agentic regulatory compliance, with every finding traced to the exact source text.">
<style>
/* ======================================================================
   Tokens. Every colour is a role; light and dark are selected separately.
   ====================================================================== */
:root, [data-theme="light"]{
  color-scheme: light;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --chart:#fcfcfb;
  --line:#e4e6eb; --line-2:#d2d6dd; --grid:#e1e0d9; --axis:#c3c2b7;
  --ink:#14171f; --ink-2:#454c5a; --muted:#6b7280;
  --accent:#7500c0; --accent-ink:#6a00ae; --accent-soft:#f4ebfd; --accent-line:#dcc2f5;
  --focus:#a100ff;
  --side:#14111b; --side-2:#1f1a29; --side-ink:#e9e6f0; --side-muted:#9b94ab;
  --crit:#d03b3b; --serious:#ec835a; --warn:#fab219; --good:#0ca30c; --low:#8a94a6;
  --crit-bg:#fdecec; --crit-ink:#9b1c1c;
  --high-bg:#fdf0e9; --high-ink:#9a3412;
  --med-bg:#fef5dc; --med-ink:#7a5000;
  --low-bg:#eef1f5; --low-ink:#475467;
  --good-bg:#e7f6e7; --good-ink:#0f5f0f;
  --info-bg:#e8f1fd; --info-ink:#1c5cab;
  --s100:#cde2fb; --s200:#9ec5f4; --s300:#6da7ec; --s400:#3987e5; --s500:#256abf; --s600:#184f95;
  --series:#2a78d6;
  --hl:#fff1b8; --hl-ring:#e9c13d;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);
}
[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1014; --surface:#161920; --surface-2:#1c2028; --chart:#1a1a19;
  --line:#272c36; --line-2:#353b47; --grid:#2c2c2a; --axis:#383835;
  --ink:#f2f4f8; --ink-2:#c3c8d2; --muted:#8f97a6;
  --accent:#b45cff; --accent-ink:#cf9bff; --accent-soft:rgba(161,0,255,.16); --accent-line:rgba(180,92,255,.45);
  --focus:#cf9bff;
  --side:#0a090e; --side-2:#17141f; --side-ink:#e9e6f0; --side-muted:#8e879d;
  --crit-bg:rgba(208,59,59,.18); --crit-ink:#f4a3a3;
  --high-bg:rgba(236,131,90,.18); --high-ink:#f6b494;
  --med-bg:rgba(250,178,25,.16); --med-ink:#f8cf72;
  --low-bg:rgba(138,148,166,.18); --low-ink:#c3cad6;
  --good-bg:rgba(12,163,12,.18); --good-ink:#7fd67f;
  --info-bg:rgba(57,135,229,.18); --info-ink:#9ec5f4;
  --series:#3987e5;
  --hl:rgba(250,178,25,.28); --hl-ring:rgba(250,178,25,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:13.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ======================================================================
   Shell
   ====================================================================== */
.shell{display:grid;grid-template-columns:248px 1fr;height:100vh}
.side{
  background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;
  border-right:1px solid rgba(255,255,255,.06);min-height:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
.mark{width:34px;height:34px;flex-shrink:0;display:block;filter:drop-shadow(0 3px 8px rgba(130,0,230,.35))}
.mark svg,.avatar svg{width:100%;height:100%;display:block}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand span{display:block;font-size:11px;color:var(--side-muted);line-height:1.3}
.navscroll{flex:1;overflow-y:auto;padding:4px 10px 12px}
.navscroll::-webkit-scrollbar-thumb{background:#2c2737}
.ngroup{margin-top:14px}
.ngroup h6{
  font-size:10.5px;font-weight:650;letter-spacing:.7px;text-transform:uppercase;
  color:var(--side-muted);padding:0 10px 6px;
}
.sidefoot{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--side-muted);line-height:1.6}
.sidefoot b{color:#d9d4e4;font-weight:600}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{
  display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-shrink:0;min-height:58px;
}
.crumbs{min-width:0}
.crumbs small{display:block;font-size:11.5px;color:var(--muted)}
.crumbs h1{font-size:16px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.entity{
  display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface-2);white-space:nowrap;
}
.entity .av{width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:11px}
.entity b{display:block;font-size:12.5px;font-weight:600;line-height:1.2}
.entity span{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-2);white-space:nowrap;
}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--low)}
.pill.ok .d{background:var(--good)}
.pill.ai .d{background:#a100ff}
.crumbs{flex-shrink:0;min-width:150px}
@media (max-width:1440px){#runPill{display:none}}
@media (max-width:1300px){.entity{display:none}}
.iconbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;
  font-weight:600;font-size:13px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  white-space:nowrap;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
[data-theme="dark"] .btn.primary{color:#14051f}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft)}

.runbar{height:3px;background:transparent;flex-shrink:0;position:relative;overflow:hidden}
.runbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:#a100ff;transition:width .35s}
.banner{
  display:none;align-items:center;gap:12px;padding:9px 24px;font-size:12.5px;flex-shrink:0;
  background:var(--med-bg);color:var(--med-ink);border-bottom:1px solid var(--line);
}
.banner.on{display:flex}
.banner svg{width:16px;height:16px;flex-shrink:0}

#view{flex:1;overflow-y:auto;padding:22px 24px 48px}
.page{max-width:1480px;margin:0 auto}
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead h2{font-size:20px;font-weight:650;letter-spacing:-.3px}
.phead p{font-size:13px;color:var(--ink-2);margin-top:3px;max-width:860px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ======================================================================
   Surfaces
   ====================================================================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>.hd h3{font-size:13.5px;font-weight:650}
.card>.hd .sub{font-size:12px;color:var(--muted)}
.card>.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card>.bd{padding:16px}
.card>.bd.flush{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-7-5{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g-5-7{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.mt{margin-top:16px}
@media (max-width:1180px){.g2,.g3,.g-7-5,.g-5-7{grid-template-columns:1fr}}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--accent-line)}
.kpi .lb{font-size:12px;color:var(--ink-2);font-weight:550;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.6px;margin-top:4px;line-height:1.15}
.kpi .v small{font-size:13px;font-weight:550;color:var(--muted);letter-spacing:0;margin-left:3px}
.kpi .nt{font-size:11.5px;color:var(--muted);margin-top:3px;min-height:17px}
.meter{height:6px;border-radius:3px;background:var(--s100);margin-top:9px;overflow:hidden;display:flex;gap:2px}
[data-theme="dark"] .meter{background:#1c2a3f}
.meter i{display:block;height:100%}

/* Pipeline flow: a pulse travels the chain */
.flowwrap{overflow-x:auto}
.flow{position:relative;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));padding:18px 12px 16px;min-width:760px}
.flow .track{position:absolute;left:calc((100% - 24px)/18 + 12px);right:calc((100% - 24px)/18 + 12px);top:37px;height:2px;background:var(--line-2);overflow:hidden}
.flow .track i{position:absolute;top:0;left:-25%;width:25%;height:100%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:flowpulse 3s linear infinite}
@keyframes flowpulse{to{left:100%}}
.fnode{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px}
.fnode .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--accent-line);font-weight:650;font-size:13px;transition:border-color .15s,background .15s}
.fnode:hover .dot{border-color:var(--accent);background:var(--accent-soft)}
.fnode .fl{font-size:11.5px;color:var(--ink-2)}

/* Proof loop: find the sentence, match it, tick */
.proof{display:flex;align-items:center;gap:3px;margin-top:9px;height:14px}
.proof i{flex:1;height:6px;border-radius:3px;background:var(--good-bg)}
.proof .hit{flex:1.6;animation:prove 3.2s ease-in-out infinite}
.proof svg{width:14px;height:14px;color:var(--good);opacity:0;animation:tick 3.2s ease-in-out infinite}
@keyframes prove{0%,15%{background:var(--good-bg)}35%,50%{background:var(--hl-ring)}65%,100%{background:var(--good)}}

/* Dashboard */
.dhead{margin-bottom:18px}
.dhead h2{font-size:22px;font-weight:700;letter-spacing:-.4px}
.dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.dmeta .sep{color:var(--line-2)}
.dmeta .scope{border-bottom:1px dotted var(--muted);cursor:help}
.dsrc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.src-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:11.5px;color:var(--ink-2);transition:border-color .15s,color .15s}
.src-chip svg{width:13px;height:13px;color:var(--good);flex-shrink:0}
.src-chip.warn svg{color:var(--warn)}
.src-chip:hover{border-color:var(--accent-line);color:var(--ink);text-decoration:none}
.src-chip .ext{display:inline-flex}
.src-chip .ext svg{width:11px;height:11px;color:var(--muted)}
.src-lbl{font-size:11.5px;color:var(--muted);align-self:center;margin-right:2px}

.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);margin-bottom:16px;overflow:hidden}
.hero-a,.stile{cursor:pointer;transition:background .15s}
.hero-a:hover,.stile:hover{background:var(--surface-2)}
.hero-a{padding:20px 24px 18px;border-right:1px solid var(--line)}
.hero .lb{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.hero-fig{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.hero-fig b{font-size:52px;font-weight:700;letter-spacing:-1.6px;line-height:1}
.hero-fig b small{font-size:24px;letter-spacing:-.4px;margin-left:2px}
.hero-fig span{font-size:13px;color:var(--muted)}
.hbar{position:relative;margin-top:16px;padding-top:20px}
.hbar .segs{display:flex;gap:2px;height:10px}
.hbar .segs i{display:block;height:100%}
.hbar .segs i:first-child{border-radius:5px 0 0 5px}
.hbar .segs i:last-child{border-radius:0 5px 5px 0}
.hbar .segs i:only-child{border-radius:5px}
.hbar .tgt{position:absolute;top:14px;bottom:-4px;border-left:2px solid var(--ink)}
.hbar .tgt span{position:absolute;top:-16px;left:0;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap}
.hlegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.hlegend span{display:inline-flex;align-items:center;gap:6px}
.hlegend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.hlegend b{color:var(--ink);font-weight:650}
.hero-b{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stile{padding:20px 20px 18px;display:flex;flex-direction:column}
.stile+.stile{border-left:1px solid var(--line)}
.stile .v{font-size:32px;font-weight:700;letter-spacing:-.9px;line-height:1.1;margin-top:8px}
.stile .v small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.stile .nt{font-size:12px;color:var(--muted);margin-top:3px}
.stile .viz{margin-top:auto;padding-top:16px}
.sevbar{display:flex;gap:2px;height:8px}
.sevbar i{display:block;height:100%}
.sevbar i:first-child{border-radius:4px 0 0 4px}
.sevbar i:last-child{border-radius:0 4px 4px 0}
.cgrid{display:grid;gap:3px}
.cgrid i{height:12px;border-radius:3px;display:block}
@media (max-width:1280px){.hero{grid-template-columns:1fr}.hero-a{border-right:none;border-bottom:1px solid var(--line)}}
@media (max-width:760px){.hero-b{grid-template-columns:1fr}.stile+.stile{border-left:none;border-top:1px solid var(--line)}}

.risks .row{display:grid;grid-template-columns:74px 84px minmax(0,1fr) auto 14px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.risks .row:last-child{border-bottom:none}
.risks .row:hover{background:var(--surface-2)}
.risks .row:hover .chev{color:var(--accent-ink);transform:translateX(2px)}
.risks .t{font-size:13px;font-weight:550;color:var(--ink);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.risks .s{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.risks .due{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.risks .due small{display:block;font-size:11px;color:var(--muted)}
.risks .due.late,.risks .due.late small{color:var(--crit-ink);font-weight:600}
.risks .chev{display:flex}
.risks .chev svg{width:14px;height:14px;color:var(--muted);transition:transform .15s,color .15s}

.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack>.card:first-child{flex:1}
.chg{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.chg:last-child{border-bottom:none}
.chg:hover{background:var(--surface-2)}
.chg .t{font-size:13px;font-weight:550}
.chg .s{font-size:11.5px;color:var(--muted);margin-top:1px}
.areas{display:flex;flex-direction:column;gap:13px}
.area{display:grid;grid-template-columns:148px minmax(0,1fr) 28px;gap:12px;align-items:center;cursor:pointer;border-radius:6px}
.area .nm{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area:hover .nm{color:var(--ink)}
.area:hover .bar{filter:brightness(1.08)}
.area .bar{display:flex;gap:2px;height:12px}
.area .bar i{display:block;height:100%}
.area .bar i:last-child{border-radius:0 4px 4px 0}
.area .n{font-size:12.5px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums}
.alegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-bottom:16px}
.alegend span{display:inline-flex;align-items:center;gap:6px}
.alegend i{width:9px;height:9px;border-radius:2px;display:inline-block}
@keyframes tick{0%,55%{opacity:0;transform:scale(.6)}70%,100%{opacity:1;transform:scale(1)}}

/* Coverage decision steps */
.decide{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.decide .q{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center}
.decide .qn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:650;color:var(--ink-2)}
.decide .qn svg{width:12px;height:12px;color:var(--good)}
.decide .out{font-size:11.5px;color:var(--muted);white-space:nowrap}
.decide .out b{color:var(--ink);font-weight:600}
@media (max-width:1280px){.link::after{display:none}}

/* Chips / badges */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5;
}
.chip .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip.critical{background:var(--crit-bg);color:var(--crit-ink)} .chip.critical .d{background:var(--crit)}
.chip.high{background:var(--high-bg);color:var(--high-ink)} .chip.high .d{background:var(--serious)}
.chip.medium{background:var(--med-bg);color:var(--med-ink)} .chip.medium .d{background:var(--warn)}
.chip.low{background:var(--low-bg);color:var(--low-ink)} .chip.low .d{background:var(--low)}
.chip.good{background:var(--good-bg);color:var(--good-ink)} .chip.good .d{background:var(--good)}
.chip.info{background:var(--info-bg);color:var(--info-ink)} .chip.info .d{background:var(--s400)}
.chip.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.accent{background:var(--accent-soft);color:var(--accent-ink)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:550;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.ref{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink)}
.check{display:inline-flex;align-items:center;gap:4px;color:var(--good-ink);font-weight:600;font-size:12px}
.check svg{width:14px;height:14px}

/* Tables */
.tablewrap{overflow:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px}
table.t th{
  position:sticky;top:0;z-index:1;background:var(--surface-2);text-align:left;font-weight:600;
  font-size:11.5px;color:var(--ink-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  user-select:none;
}
table.t th.sort{cursor:pointer}
table.t th.sort:hover{color:var(--ink)}
table.t th .ar{opacity:.5;margin-left:3px}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--surface-2)}
table.t td.wrap{min-width:280px;max-width:520px}
table.t td.wrap-s{min-width:150px}
table.t td.wrap-m{min-width:210px}
table.t td.nowrap,table.t th.nowrap{white-space:nowrap}
table.t .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{
  display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--surface);min-width:240px;height:32px;
}
.search svg{width:14px;height:14px;color:var(--muted)}
.search input{border:none;outline:none;background:transparent;flex:1;font-size:12.8px;height:30px}
select.sel{
  height:32px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 28px 0 10px;
  font-size:12.5px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px;background-repeat:no-repeat;
}
.count{font-size:12px;color:var(--muted);margin-left:auto}
input.txt,textarea.txt{
  border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:8px 11px;font-size:13px;width:100%;
}
input.txt:focus,textarea.txt:focus,select.sel:focus,.search:focus-within{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Callouts and findings */
.callout{display:flex;gap:12px;padding:13px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2)}
.callout svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.callout.crit{background:var(--crit-bg);border-color:transparent;color:var(--crit-ink)}
.callout.warn{background:var(--med-bg);border-color:transparent;color:var(--med-ink)}
.callout.info{background:var(--info-bg);border-color:transparent;color:var(--info-ink)}
.callout.ok{background:var(--good-bg);border-color:transparent;color:var(--good-ink)}
.callout b{font-weight:650}
.finding{display:grid;grid-template-columns:4px 1fr;gap:0 14px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.finding:last-child{border-bottom:none}
.finding:hover{background:var(--surface-2)}
.finding .bar{border-radius:2px;grid-row:span 3}
.finding .k{font-size:11px;font-weight:650;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.finding .h{font-size:14px;font-weight:600;margin:2px 0 4px;line-height:1.4}
.finding .p{font-size:12.8px;color:var(--ink-2)}
.finding .p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Key-value grid */
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 14px;font-size:12.8px}
.kv dt{color:var(--muted)}
.kv dd{color:var(--ink);min-width:0}

/* Source text with highlighted span */
.src{
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  font:12.5px/1.75 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre-wrap;word-break:break-word;
  max-height:300px;overflow:auto;color:var(--ink-2);
}
.src mark{background:var(--hl);color:var(--ink);box-shadow:0 0 0 1px var(--hl-ring);border-radius:2px;padding:0 1px}
.src del{background:var(--crit-bg);color:var(--crit-ink);text-decoration:line-through}
.src ins{background:var(--good-bg);color:var(--good-ink);text-decoration:none}
.quote{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:13.5px;line-height:1.6;color:var(--ink)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(760px,96vw);background:var(--surface);z-index:41;
  box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer .dh h3{font-size:16px;font-weight:650;line-height:1.35}
.drawer .dh small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.drawer .db{flex:1;overflow-y:auto;padding:8px 22px 30px}
.step{display:grid;grid-template-columns:30px 1fr;gap:0 14px;position:relative;padding-top:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:14px;top:48px;bottom:-18px;width:2px;background:var(--line)}
.step .no{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line);z-index:1;
}
.step.bad .no{background:var(--crit-bg);color:var(--crit-ink);border-color:transparent}
.step.warn .no{background:var(--med-bg);color:var(--med-ink);border-color:transparent}
.step.ok .no{background:var(--good-bg);color:var(--good-ink);border-color:transparent}
.step .sh{display:flex;align-items:center;gap:8px;min-height:30px;flex-wrap:wrap}
.step .sh h4{font-size:13.5px;font-weight:650}
.step .sh .lbl{font-size:10.5px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.step .sb{padding:6px 0 4px;font-size:12.8px;color:var(--ink-2)}
.step .sb .kv{margin-top:6px}

/* Tooltip, toast */
#tip{
  position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;
  padding:8px 10px;border-radius:7px;max-width:340px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .1s;line-height:1.45;
}
#tip.on{opacity:1}
#tip b{font-weight:650}
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);z-index:70;opacity:0;
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow-lg);
  transition:all .2s;pointer-events:none;
}
#toast.on{opacity:1;transform:translateX(-50%)}

/* Charts */
.chart{background:var(--chart);border-radius:8px}
.chart text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
.chart .lbl{fill:var(--ink-2)}
.chart .val{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat{display:grid;grid-template-columns:86px repeat(3,minmax(0,1fr));gap:3px;font-size:12px}
.heat .ax{display:flex;align-items:center;color:var(--muted);font-size:11.5px}
.heat .axb{text-align:center;color:var(--muted);font-size:11.5px;padding-top:4px}
.heat .cell{
  height:64px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:650;font-size:18px;cursor:pointer;transition:transform .1s;
}
.heat .cell small{font-size:10.5px;font-weight:550;opacity:.85}
.heat .cell:hover{transform:scale(1.03)}
.heat .cell.zero{background:var(--surface-2);color:var(--muted);cursor:default;font-weight:500}
.heat .cell.sel{outline:2px solid var(--accent);outline-offset:1px}

/* Agent timeline */
.agents{display:flex;flex-direction:column}
.agent{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.agent:last-child{border-bottom:none}
.agent .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.agent .ic svg{width:16px;height:16px}
.agent.running .ic{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.agent.running .ic svg{animation:spin 1.1s linear infinite}
.agent.done .ic{background:var(--good-bg);color:var(--good-ink);border-color:transparent}
.agent.failed .ic{background:var(--crit-bg);color:var(--crit-ink);border-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.agent h4{font-size:13.5px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.agent .goal{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.agent .out{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.agent .why{font-size:12.5px;color:var(--ink-2);margin-top:8px;padding:8px 11px;border-radius:7px;background:var(--surface-2);border-left:3px solid var(--accent-line)}
.agent .tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.fn{font:11px ui-monospace,Consolas,monospace;padding:2px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.fn.m{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.agent .ms{font:12px ui-monospace,Consolas,monospace;color:var(--muted);white-space:nowrap}

/* Pipeline graph */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 18px;padding:16px}
@media (max-width:1100px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pnode{
  min-width:0;padding:10px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  font-size:12px;position:relative;
}
.pnode:not(:last-child)::after{content:"";position:absolute;right:-15px;top:50%;width:12px;height:1.5px;background:var(--line-2)}
.pnode:nth-child(6n)::after{display:none}
@media (max-width:1100px){.pnode:nth-child(6n)::after{display:block}.pnode:nth-child(3n)::after{display:none}}
.pnode b{display:block;font-size:12px;font-weight:650;white-space:nowrap}
.pnode span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.pnode.running{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pnode.done{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.pnode.failed{border-color:var(--crit)}
.pnode .s{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.pnode.running .s{background:#a100ff}
.pnode.done .s{background:var(--good)}
.pnode.failed .s{background:var(--crit)}

/* Matrix */
.matrix{border-collapse:separate;border-spacing:0;font-size:12px}
.matrix th{font-weight:550;color:var(--ink-2);padding:4px;white-space:nowrap}
.matrix th.rot{height:120px;vertical-align:bottom;padding:0 0 6px}
.matrix th.rot div{writing-mode:vertical-rl;transform:rotate(180deg);font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:600;margin:0 auto}
.matrix td{padding:2px;text-align:center}
.matrix td.rh{text-align:left;padding:3px 10px 3px 0;white-space:nowrap;cursor:pointer}
.matrix td.rh:hover .ref{color:var(--accent-ink)}
.mcell{width:22px;height:22px;border-radius:5px;display:inline-block;background:var(--surface-2);border:1px solid var(--line);vertical-align:middle}
.mcell.full{background:var(--good);border-color:transparent}
.mcell.partial{background:var(--warn);border-color:transparent}
.mcell.scope{background:var(--serious);border-color:transparent}
.mcell.none{background:var(--crit);border-color:transparent}

/* 9-blocker */
.nine{display:grid;grid-template-columns:70px repeat(3,minmax(0,1fr));gap:4px;max-width:520px}
.nine .h{font-size:12px;font-weight:650;color:var(--ink-2);display:flex;align-items:center;justify-content:center;padding:6px}
.nine .c{height:62px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.nine .c.reach{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.nine .c.claim{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
[data-theme="dark"] .nine .c.claim{color:#14051f}

/* Toggles */
.switch{position:relative;width:36px;height:20px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .tl{flex:1;font-size:13px}
.trow .tl small{display:block;color:var(--muted);font-size:11.5px}

.drop{
  border:1.5px dashed var(--line-2);border-radius:10px;padding:22px;text-align:center;background:var(--surface-2);
  color:var(--ink-2);font-size:13px;transition:.15s;
}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:26px;height:26px;color:var(--muted);margin-bottom:6px}

.diffgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1100px){.diffgrid{grid-template-columns:1fr}}
.prog{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--series)}
.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.spacer{height:16px}

/* Sidebar: sections named for the question they answer; the active one shows its pages */
.brand{position:relative}
.navtoggle{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--side-muted)}
.navtoggle:hover{background:var(--side-2);color:#fff}
.navtoggle svg{width:16px;height:16px}
.nsec{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;color:#d9d4e4;position:relative}
.nsec svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.nsec:hover{background:var(--side-2);color:#fff}
.nsec.on{background:var(--side-2);color:#fff}
.nsec.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#a100ff}
.nsec .nl{display:flex;flex-direction:column;min-width:0;flex:1}
.nsec .nl b{font-size:13.3px;font-weight:600;line-height:1.3}
.nsec .nl small{font-size:11px;color:var(--side-muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nsec .cnt,.nsub .cnt{margin-left:auto;font-size:11px;font-weight:650;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:#d9d4e4;white-space:nowrap}
.nsec .cnt.alert{background:rgba(208,59,59,.28);color:#ffb4b4}
.nsec-wrap{margin-bottom:2px}
.nsubs{margin:2px 0 6px 28px;padding-left:10px;border-left:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:1px}
.nsub{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 9px;border-radius:6px;font-size:12.6px;color:#bdb6cc}
.nsub:hover{background:var(--side-2);color:#fff}
.nsub.on{color:#fff;font-weight:600;background:rgba(161,0,255,.22)}
.nhelp{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:7px;color:#d9d4e4;font-size:12.5px;font-weight:600}
.nhelp:hover{background:var(--side-2);color:#fff}
.nhelp svg{width:16px;height:16px}
/* Icon rail */
.navmin .shell{grid-template-columns:68px 1fr}
.navmin .brand .bt,.navmin .nsec .nl,.navmin .nsec .cnt,.navmin .nsubs,.navmin .ngroup h6,.navmin .sft{display:none}
.navmin .brand{flex-direction:column;gap:8px;padding:14px 0 10px;align-items:center}
.navmin .navtoggle{margin:0}
.navmin .navscroll{padding:4px 8px}
.navmin .nsec{justify-content:center;padding:11px 0}
.navmin .nhelp{justify-content:center}
@media (max-width:1000px){html:not(.navmin) .shell{grid-template-columns:220px 1fr}}

/* In-page tabs for the pages of a section */
.tabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);margin:-6px 0 20px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;font-size:13px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;font-weight:650;padding:0 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

/* Dashboard launcher */

/* Top-bar search trigger and command palette */
.topsearch{min-width:0;height:34px;cursor:pointer;gap:8px;padding:0 8px 0 10px}
.topsearch svg{width:14px;height:14px}
kbd{white-space:nowrap;font:11px ui-monospace,Consolas,monospace;padding:1px 6px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--muted)}
@media (max-width:1250px){.topsearch .muted,.topsearch kbd{display:none}}
.palette{position:fixed;inset:0;z-index:80;background:rgba(10,12,18,.4);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.palette.on{display:flex}
.pbox{width:min(680px,92vw);background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--line)}
.pbox .pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pbox .pin svg{width:17px;height:17px;color:var(--muted)}
.pbox input{flex:1;border:none;outline:none;background:transparent;font-size:15px}
.plist{max-height:52vh;overflow:auto;padding:6px}
.pitem{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;cursor:pointer}
.pitem.on,.pitem:hover{background:var(--accent-soft)}
.pitem .k{font-size:10.5px;font-weight:650;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);width:86px;flex-shrink:0}
.pitem .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

/* Guided tour */
.tour-ring{position:fixed;z-index:90;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,12,18,.55);pointer-events:none;transition:all .25s ease;outline:2px solid #a100ff}
.tour-card{position:fixed;z-index:91;width:340px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);padding:16px 18px;border:1px solid var(--line)}
.tour-card .st{font-size:11px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-ink)}
.tour-card h4{font-size:15px;font-weight:650;margin:4px 0 6px}
.tour-card p{font-size:13px;color:var(--ink-2)}
.tour-card .nav{display:flex;gap:8px;margin-top:14px;align-items:center}

/* Ask Accentic: floating assistant */
.chat-fab{position:fixed;right:24px;bottom:24px;z-index:39;width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,#7500c0,#a100ff 55%,#c25bff);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 28px rgba(117,0,192,.45),0 2px 6px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.2,.9,.3,1.3),box-shadow .2s}
.chat-fab:hover{transform:scale(1.07);box-shadow:0 14px 34px rgba(117,0,192,.55),0 2px 6px rgba(0,0,0,.2)}
.chat-fab svg{width:26px;height:26px;transition:transform .25s}
.chat-fab.open svg{transform:rotate(90deg)}
.chat-fab .ring{position:absolute;inset:0;border-radius:50%;border:2px solid #b45cff;animation:fabpulse 2.6s ease-out infinite;pointer-events:none}
.chat-fab.open .ring,.chat-fab.seen .ring{display:none}
@keyframes fabpulse{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(1.55);opacity:0}}
.chat-fab .dot{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;background:#ef4444;border:2px solid var(--bg);display:none}
.chat-fab.unread .dot{display:block}
.chat-fab .lbl{position:absolute;right:68px;white-space:nowrap;background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;
  padding:6px 10px;border-radius:8px;opacity:0;transform:translateX(6px);transition:opacity .15s,transform .15s;pointer-events:none}
.chat-fab:hover .lbl{opacity:1;transform:none}
.chat-fab.open .lbl{display:none}

.chat-panel{position:fixed;right:24px;bottom:96px;z-index:39;width:410px;height:min(660px,calc(100vh - 128px));
  display:flex;flex-direction:column;overflow:hidden;border-radius:20px;background:var(--bg);border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(16,24,40,.28),0 4px 14px rgba(16,24,40,.12);transform-origin:bottom right;
  opacity:0;visibility:hidden;transform:translateY(18px) scale(.94);
  transition:opacity .2s ease,transform .28s cubic-bezier(.2,.9,.3,1.15),visibility 0s linear .28s}
.chat-panel.on{opacity:1;visibility:visible;transform:none;transition:opacity .2s ease,transform .28s cubic-bezier(.2,.9,.3,1.15)}
.chat-head{display:flex;align-items:center;gap:11px;padding:14px 14px 14px 16px;color:#fff;
  background:linear-gradient(135deg,#5b00a0,#8f00f0 55%,#b45cff)}
.chat-head .avatar{width:34px;height:34px;position:relative;border-radius:9px;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.chat-head .avatar::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid #7a00cc}
.chat-head b{display:block;font-size:14.5px;font-weight:700}
.chat-head small{display:block;font-size:11.5px;opacity:.85}
.chat-head .acts{margin-left:auto;display:flex;gap:4px}
.chat-head .acts button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff}
.chat-head .acts button:hover{background:rgba(255,255,255,.16)}
.chat-head .acts svg{width:17px;height:17px}
.chat-head .acts .newc{display:none}
.chat-panel.has .chat-head .acts .newc{display:grid}
.chat-body{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:16px}

.avatar{width:28px;height:28px;border-radius:8px;flex-shrink:0}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg.new{animation:msgin .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.98)}}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:linear-gradient(135deg,#7500c0,#a100ff);color:#fff;border-radius:18px 18px 4px 18px;padding:9px 13px;max-width:82%;font-size:13px;white-space:pre-wrap;box-shadow:0 4px 12px rgba(117,0,192,.25)}
.msg.bot .body{flex:1;min-width:0}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:11px 13px;box-shadow:var(--shadow)}
.msg.bot .bubble p{font-size:13px;line-height:1.6;margin-bottom:7px}
.msg.bot .bubble .src{font-size:12px}
.msg-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:5px}
.msg-foot details summary{cursor:pointer}
.msg-foot .iconbtn{width:24px;height:24px;border-radius:7px}
.msg-foot .iconbtn svg{width:13px;height:13px}
.msg-foot .chip svg{width:12px;height:12px}
.typing{display:inline-flex;gap:4px;padding:5px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:#a100ff;animation:typing 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.welcome{display:flex;flex-direction:column;align-items:flex-start;gap:12px;animation:msgin .35s ease-out}
.welcome .bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:13px;line-height:1.6;box-shadow:var(--shadow)}
.welcome .bubble b{display:block;font-size:14px;margin-bottom:2px}
.suggest{display:flex;flex-direction:column;gap:7px;width:100%;padding-left:37px}
.suggest button{display:flex;align-items:center;gap:8px;text-align:left;padding:9px 12px;background:var(--surface);border:1px solid var(--accent-line);border-radius:999px;font-size:12.5px;color:var(--accent-ink);transition:background .15s,transform .15s}
.suggest button:hover{background:var(--accent-soft);transform:translateX(3px)}
.suggest svg{width:13px;height:13px;flex-shrink:0;margin-left:auto}
.composer{padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--surface)}
.composer form{display:flex;align-items:flex-end;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:5px 5px 5px 13px;transition:border-color .15s,box-shadow .15s}
.composer form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{flex:1;border:none;background:transparent;resize:none;outline:none;font-size:13.5px;line-height:1.5;max-height:120px;padding:6px 0}
.composer .send{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7500c0,#a100ff);color:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .15s}
.composer .send:hover:not(:disabled){transform:scale(1.06)}
.composer .send:disabled{opacity:.4;cursor:default}
.composer .send svg{width:17px;height:17px}
.composer .hint{font-size:10.5px;color:var(--muted);text-align:center;margin-top:6px}
@media (max-width:560px){
  .chat-panel{right:0;bottom:0;width:100vw;height:100dvh;border-radius:0}
  .chat-fab{right:16px;bottom:16px}
}
.cite{display:inline-flex;align-items:center;gap:4px;margin:0 3px 3px 0;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--good-bg);color:var(--good-ink);cursor:pointer;border:none}
.cite.f{background:var(--info-bg);color:var(--info-ink)}
.cite svg{width:12px;height:12px}

/* Kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1180px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.col h4{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;padding:2px 4px 10px}
.col h4 .n{margin-left:auto;font-size:11.5px;color:var(--muted)}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.task{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--low);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.task:hover{border-color:var(--accent-line)}
.task .tt{font-size:12.5px;font-weight:600;line-height:1.4;margin:4px 0 6px}
.task .tm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.overdue{color:var(--crit-ink);font-weight:650}
.thread{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:260px;overflow:auto}
.cmt{padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px}
.cmt.sys{background:var(--accent-soft);border-color:transparent}
.cmt b{font-size:12px}
.cmt small{color:var(--muted);margin-left:6px}

/* Print: the submission pages (coverage, architecture) export cleanly to PDF. */
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .shell{display:block;height:auto}
  .side,.top,.runbar,.banner,.phead .acts,#tip,#toast,.scrim,.drawer,.btn,.iconbtn,details.review,.chat-fab,.chat-panel{display:none!important}
  .main,#view{overflow:visible;height:auto;padding:0}
  .card{box-shadow:none;break-inside:avoid}
  .grid.g2,.grid.g-7-5,.grid.g-5-7{grid-template-columns:1fr 1fr}
  .tablewrap{overflow:visible}
  table.t th{position:static}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Primary">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg-side" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6200ad"/><stop offset="1" stop-color="#b24bff"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg-side)"/><rect x="7.2" y="16.3" width="17.6" height="5" rx="2.5" fill="#ffc83d" transform="rotate(-8 16 18.8)"/><path d="M9.1 24.4 16 8l6.9 16.4" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

    </div>
    <nav class="navscroll" id="nav"></nav>
    <div class="sidefoot">
      <button class="nhelp" data-act="help" title="Help, glossary and shortcuts"><span id="helpIco2"></span><span class="sft">Help &amp; glossary</span></button>

    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="crumbs"><small id="crumb">Overview</small><h1 id="title">Executive summary</h1></div>

      <div class="entity" title="Assessed entity and assessment date">
        <div class="av">MB</div>
        <div><b id="entName">Meridian Bank Limited</b><span id="entDate">Assessment date —</span></div>
      </div>
      <span class="pill" id="runPill"><span class="d"></span><span id="runTxt">Not run</span></span>
      <button class="search topsearch" id="kBtn" aria-label="Search everything (Ctrl+K)"><span id="kIco"></span><span class="muted">Search</span><kbd>Ctrl K</kbd></button>
      <button class="iconbtn" id="helpBtn" data-act="help" aria-label="Help: how to use Accentic" title="Help: sections, glossary, shortcuts"></button>
      <button class="iconbtn" id="tourBtn" aria-label="Take the guided tour" title="Guided tour"></button>
      <a class="iconbtn" id="reportBtn" href="/api/report" target="_blank" rel="noopener" aria-label="Open the board report" title="Board report (print or save as PDF, or download Word)"></a>
      <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <button class="btn primary" id="runBtn"></button>
    </header>
    <div class="runbar" aria-hidden="true"><i id="runProg"></i></div>
    <div class="banner" id="drift" role="status"></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dh">
    <div style="flex:1;min-width:0"><small id="dKicker"></small><h3 id="dTitle"></h3></div>
    <button class="iconbtn" id="dClose" aria-label="Close"></button>
  </div>
  <div class="db" id="dBody"></div>
</aside>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search everything">
  <div class="pbox"><div class="pin"><span id="pIco"></span><input id="pIn" placeholder="Search obligations, controls, gaps, pages…" aria-label="Search" autocomplete="off"><kbd>Esc</kbd></div>
  <div class="plist" id="pList" role="listbox"></div>
  <div class="pfoot"><span>↑↓ to move</span><span>Enter to open</span><span>Esc to close</span></div></div>
</div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<button class="chat-fab" id="chatFab" data-act="chattoggle" aria-label="Ask Accentic" aria-expanded="false" aria-controls="chatPanel"><span class="ring"></span><span id="fabIco"></span><span class="dot"></span><span class="lbl">Ask Accentic</span></button>
<section class="chat-panel" id="chatPanel" role="dialog" aria-label="Ask Accentic" aria-hidden="true"></section>

<script>
'use strict';
/* =====================================================================
   Core: state, helpers, icons
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Optional access token (server sets ACCENTIC_API_TOKEN). Asked for once on a 401. */
const token = () => sessionStorage.getItem('accentic-token') || '';
async function send(p, o = {}){
  const r = await fetch(p, {...o, headers:{...(o.headers || {}), ...(token() ? {'X-Accentic-Token': token()} : {})}});
  if(r.status === 401){
    const t = prompt('This action needs the Accentic access token (ACCENTIC_API_TOKEN).');
    if(t){ sessionStorage.setItem('accentic-token', t.trim()); return send(p, o); }
  }
  return r;
}
const api = async (p, o) => {
  const r = await send(p, o);
  const body = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(body.detail || r.statusText);
  return body;
};
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
const pct = (n, d) => d ? Math.round(1000 * n / d) / 10 : 0;
const fmtDate = s => {
  if(!s) return '—';
  const d = new Date(String(s).length <= 10 ? s + 'T00:00:00' : String(s).replace(' ', 'T') + 'Z');
  return isNaN(d) ? s : d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
};
const fmtTime = s => {
  if(!s) return '—';
  const d = new Date(String(s).replace(' ', 'T') + 'Z');
  return isNaN(d) ? s : d.toLocaleString('en-GB', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
};
const by = (k, dir=1) => (a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * dir;
const groupCount = (arr, f) => arr.reduce((m, x) => (m[f(x)] = (m[f(x)] || 0) + 1, m), {});

const P = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
/* The Accentic mark: an A over a highlighter stroke, because every claim highlights
   its exact source text. Each copy gets its own gradient id so no instance depends
   on another one being rendered. */
let logoSeq = 0;
const logo = () => {
  const id = 'lg' + (++logoSeq);
  return `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6200ad"/><stop offset="1" stop-color="#b24bff"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#${id})"/><rect x="7.2" y="16.3" width="17.6" height="5" rx="2.5" fill="#ffc83d" transform="rotate(-8 16 18.8)"/><path d="M9.1 24.4 16 8l6.9 16.4" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
};
const I = {

  file: P('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
  list: P('<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'),

  split: P('<path d="M16 3h5v5M8 3H3v5M21 3l-7 7M3 3l7 7M12 21v-8"/>'),
  bank: P('<path d="M3 10l9-6 9 6M5 10v8M19 10v8M9 10v8M15 10v8M3 21h18"/>'),
  shield: P('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>'),

  search: P('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),

  arrow: P('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  refresh: P('<path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/>'),
  learn: P('<path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5M21 9v6"/>'),
  chat: P('<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>'),
  send: P('<path d="M12 19V5M5 12l7-7 7 7"/>'),
  ext: P('<path d="M14 5h5v5M19 5l-8 8M17 14v5H5V7h5"/>'),
  chev: P('<path d="M9 6l6 6-6 6"/>'),
  copy: P('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),

/* Shared table renderer with sortable headers. */
function table(id, cols, rows, {onRow, emptyMsg='No records match these filters.'} = {}){
  const st = UI.sort[id];
  if(st){
    const col = cols.find(c => c.k === st.k);
    if(col){
      const key = col.sort || (r => r[col.k]);
      rows = [...rows].sort((a, b) => { const x = key(a), y = key(b); return (x > y ? 1 : x < y ? -1 : 0) * st.dir; });
    }
  }
  if(!rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  const head = cols.map(c => {
    const sortable = c.sort !== false;
    const ar = st && st.k === c.k ? (st.dir > 0 ? '▲' : '▼') : '';
    return `<th class="${sortable ? 'sort' : ''} ${c.cls || ''}" ${sortable ? `data-sort="${id}" data-k="${c.k}"` : ''} ${c.w ? `style="width:${c.w}"` : ''}>${esc(c.h)}${ar ? `<span class="ar">${ar}</span>` : ''}</th>`;
  }).join('');
  const body = rows.map(r => `<tr class="${onRow ? 'click' : ''}" ${onRow ? onRow(r) : ''}>${cols.map(c =>
    `<td class="${c.cls || ''}">${c.r ? c.r(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('');
  return `<div class="tablewrap"><table class="t"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function csv(name, cols, rows){
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const text = [cols.map(c => q(c[0])).join(','), ...rows.map(r => cols.map(c => q(c[1](r))).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + text], {type:'text/csv'}));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${rows.length} rows to ${name}`);
}

  tip.innerHTML = el.dataset.tip; tip.classList.add('on');
});
document.addEventListener('mousemove', e => {
  const tip = $('#tip');
  if(!tip.classList.contains('on')) return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if(x + w > innerWidth - 8) x = e.clientX - w - 14;
  if(y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});

});

   ===================================================================== */
const RUN = {running:false, plan:[], agents:{}};
function paintRunButton(){
  const b = $('#runBtn');
  b.disabled = RUN.running;
  b.innerHTML = RUN.running ? `${I.spin}<span>Running…</span>` : `${I.play}<span>${hasData() ? 'Re-run analysis' : 'Run analysis'}</span>`;
  const svg = b.querySelector('svg'); if(svg && RUN.running) svg.style.animation = 'spin 1s linear infinite';
}
function runAnalysis(){
  if(RUN.running) return;
  if(S.stats.auth_required && !token()){
    const t = prompt('Running the analysis needs the Accentic access token (ACCENTIC_API_TOKEN).');
    if(!t) return;
    sessionStorage.setItem('accentic-token', t.trim());
  }
  Object.assign(RUN, {running:true, plan:[], agents:{}, error:null, startedAt:Date.now()});
  paintRunButton();
  $('#runPill').className = 'pill ai';
  $('#runTxt').textContent = 'Starting…';
  $('#runProg').style.width = '2%';
  if(route() !== 'agents') go('agents'); else render();

  const es = new EventSource('/api/run' + (token() ? '?token=' + encodeURIComponent(token()) : ''));
  es.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if(e.event === 'plan'){
      RUN.plan = e.steps;
      e.steps.forEach(s => RUN.agents[s.agent] = {status:'pending', goal:s.goal, notes:[], out:{}});
    }
    const a = e.agent && RUN.agents[e.agent];
    if(a){
      if(e.event === 'start'){ a.status = 'running'; $('#runTxt').textContent = e.agent.replace('Agent', '') + '…'; }
      if(e.event === 'progress' && e.message) a.notes.push(e.message);
      if(e.event === 'done' || e.event === 'summary'){
        if(e.event === 'done'){ a.status = 'done'; a.ms = (a.ms || 0) + (e.duration_ms || 0); }
        const skip = ['event','agent','stage','duration_ms','message','mode'];
        Object.entries(e).filter(([k]) => !skip.includes(k)).forEach(([k, v]) => {
          a.out[k] = e.event === 'done' && typeof v === 'number' && typeof a.out[k] === 'number' && e.agent !== 'ObligationAgent' ? a.out[k] + v : v;
        });
      }
      if(e.event === 'failed'){ a.status = 'failed'; a.error = e.error; }
    }
    const done = Object.values(RUN.agents).filter(x => x.status === 'done').length;
    $('#runProg').style.width = Math.max(2, 100 * done / (RUN.plan.length || 10)) + '%';
    if(route() === 'agents' && UI.refresh) UI.refresh();
    if(e.event === 'complete'){ es.close(); finishRun(); }
    if(e.event === 'error'){ es.close(); finishRun(e.error); }
  };
  es.onerror = () => { es.close(); if(RUN.running) finishRun('The event stream was interrupted.'); };
}
async function finishRun(err){
  RUN.running = false; RUN.error = err || null;
  $('#runProg').style.width = '100%';
  setTimeout(() => $('#runProg').style.width = '0', 600);
  await loadAll();
  paintRunButton(); paintDrift();
  render();
  if(err) toast('Analysis failed: ' + err);
  else toast(`Analysis complete · ${S.stats.gap} gaps (${S.stats.severity?.critical || 0} critical) · ${S.stats.monitor_alert} alerts`);
}

}

}

/* Help: the sections in plain words, a glossary and the shortcuts. */
const GLOSS = [
  ['Requirement (obligation)', 'Something a regulation says the bank must or must not do, quoted exactly from the regulation.'],
  ['Applicable', 'The requirement binds this bank, given what it does and where it operates.'],
  ['Informational', 'Looks like a rule but asks for nothing, for example a definition or the title of the regulation.'],
  ['Out of scope', 'Applies only to a business the bank does not run, so it is not assessed.'],
  ['Not in this review', 'Outside the paragraphs this assessment covers (set in the bank profile). Still extracted and traceable to the source, but not tested against controls.'],
  ['Control', 'A process the bank runs to meet a requirement, such as screening customers or filing reports.'],
  ['Coverage', 'How well a control meets a requirement. Full: met and tested. Partial: met only in part, or the control is weak. None: nothing meets it.'],
  ['Scope gap', 'A control exists, but it does not reach something the requirement names, such as identity records rather than transaction records.'],
  ['Independent test', 'Accentic re-checks a control against its own evidence instead of trusting the owner’s self-assessment.'],
  ['Exception', 'The evidence shows the control failing, for example reports filed after the deadline.'],
  ['Assurance lapsed', 'The control has not been tested within its required cycle, so its result can no longer be relied on.'],
  ['Relied on owner result', 'The evidence has no figures to re-check, so the owner’s result is accepted until a sample test is done.'],
  ['Issue (gap)', 'A requirement the bank does not fully meet. Each issue has a risk score and a fix.'],
  ['Risk score', 'Impact × likelihood. Impact comes from how serious the requirement is; likelihood from how weak the control is.'],

function meter(segs){

/* ---------------------------------------------------------------- Overview */
function heatBands(g){
  const i = g.impact >= 0.8 ? 2 : g.impact >= 0.5 ? 1 : 0;
  const l = g.likelihood >= 0.7 ? 2 : g.likelihood >= 0.4 ? 1 : 0;
  return [i, l];
}
function heatmap(){
  const grid = [[[],[],[]],[[],[],[]],[[],[],[]]];
  S.gaps.forEach(g => { const [i, l] = heatBands(g); grid[i][l].push(g); });
  const max = Math.max(1, ...grid.flat().map(c => c.length));
  const steps = ['--s200','--s300','--s400','--s500','--s600'];
  const names = ['Low','Medium','High'];
  let html = '<div class="heat" role="grid" aria-label="Gaps by impact and likelihood">';
  for(let i = 2; i >= 0; i--){
    html += `<div class="ax">${names[i]} impact</div>`;
    for(let l = 0; l < 3; l++){
      const cell = grid[i][l], n = cell.length;
      if(!n){ html += `<div class="cell zero">0</div>`; continue; }
      const s = Math.min(4, Math.floor(4 * n / max));
      const sel = UI.heat && UI.heat[0] === i && UI.heat[1] === l;
      const tip = `<b>${names[i]} impact × ${names[l].toLowerCase()} likelihood</b><br>${cell.slice(0, 6).map(g => esc(refLabel(g.regulator, g.clause_ref)) + ' · ' + esc(g.severity)).join('<br>')}${n > 6 ? '<br>…' : ''}`;
      html += `<div class="cell ${sel ? 'sel' : ''}" role="gridcell" tabindex="0" data-act="heat" data-i="${i}" data-l="${l}" data-tip="${esc(tip)}"
        style="background:var(${steps[s]});color:${s >= 2 ? '#fff' : 'var(--ink)'}">${n}<small>gap${n > 1 ? 's' : ''}</small></div>`;
    }
  }
  html += `<div></div>${names.map(n => `<div class="axb">${n} likelihood</div>`).join('')}</div>`;
  return html;
}
ACTIONS.heat = t => {

function coverageByDomain(){

    return `<div style="display:grid;grid-template-columns:170px 1fr 34px;gap:12px;align-items:center">
      <div style="font-size:12.5px;color:var(--ink-2)">${esc(CAT[cat] || cat)}</div>

      <div class="num" style="font-size:12.5px;font-weight:600;text-align:right">${list.length}</div></div>`;
  }).join('')}</div>`;
}
const groupBy = (arr, f) => arr.reduce((m, x) => ((m[f(x)] ||= []).push(x), m), {});

const AREA_NAME = c => c === 'other' ? 'Other requirements' : (CAT[c] || c);
function sourceChips(){
  const regs = (S.docs || []).filter(d => d.kind === 'regulation' && d.official_url);
  const chips = regs.map(d => {
    const v = /Updated as on (.+)/.exec(d.version || '');
    const when = v && !isNaN(new Date(v[1])) ? new Date(v[1]).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
    const label = regShort(d.title, d.regulator) + (when ? ` · updated ${when}` : ' · official text');
    const tip = `<b>${esc(d.title || d.name)}</b>${d.version ? '<br>' + esc(d.version) : ''}<br>${esc(d.publisher || '')}${d.retrieved_on ? ' · downloaded ' + esc(fmtDate(d.retrieved_on)) : ''}`;
    return `<a class="src-chip" href="${esc(d.official_url)}" target="_blank" rel="noopener" data-tip="${esc(tip)}">${I.check}${esc(label)}<span class="ext">${I.ext}</span></a>`;
  });
  const sn = S.monitoring?.sanctions;
  if(sn){
    const h = sn.age_hours, ago = h < 1 ? 'under an hour ago' : h < 48 ? `${Math.round(h)}h ago` : `${Math.round(h / 24)} days ago`;
    const tip = `<b>UN Security Council Consolidated List</b><br>${sn.individuals} individuals, ${sn.entities} entities<br>RBI ¶58 requires daily verification`;
    chips.push(`<button class="src-chip ${sn.stale ? 'warn' : ''}" data-go="monitoring" data-tip="${esc(tip)}">${sn.stale ? I.warn : I.check}UN sanctions list · ${sn.stale ? 'verification overdue' : 'verified ' + ago}</button>`);
  } else {
    chips.push(`<button class="src-chip warn" data-go="monitoring">${I.warn}UN sanctions list · not synced</button>`);
  }
  return chips.join('');
}
PAGES.overview = () => {

  const st = S.stats, pf = S.profile, ap = pf.risk_appetite || {};
