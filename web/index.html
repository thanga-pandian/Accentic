  const full = cov.full || 0, mapped = st.applicable || 0;
  const scope = S.obligations.filter(o => o.scope_gap).length;
  const target = ap.min_coverage_pct ?? 0, breach = st.coverage_pct < target;

  const sc = pf.assessment_scope;
  const scopeTip = sc ? `<b>${esc(sc.label)}</b><br>${Object.entries(sc.paragraphs).map(([g, p]) => esc(g === 'GoI' ? `PMLA r.${p}` : `${g} ¶${p}`)).join('<br>')}` : '';
  const header = `<div class="dhead"><h2>Compliance posture</h2>
    <div class="dmeta"><span class="${sc ? 'scope' : ''}" ${sc ? `data-tip="${esc(scopeTip)}"` : ''}>${sc ? 'Thematic review' : 'Full review'} of ${mapped} obligations</span>
      <span class="sep">·</span><span>Every number links to the exact source text behind it</span></div>
    <div class="dsrc"><span class="src-lbl">Official sources</span>${sourceChips()}</div></div>`;

  // Hero: the one number the dashboard leads with, and where the rest stand against target.
  const segs = [['Full', full, 'var(--good)'], ['Partial', Math.max(0, (cov.partial || 0) - scope), 'var(--warn)'],
                ['Scope gap', scope, 'var(--serious)'], ['None', cov.none || 0, 'var(--crit)']];
  const total = segs.reduce((s, x) => s + x[1], 0) || 1;
  const heroA = `<div class="hero-a" data-go="mapping" tabindex="0" role="link">
      <div class="lb">Obligations fully covered <span class="chip ${breach ? 'critical' : 'good'}"><span class="d"></span>${breach ? 'Below target' : 'On target'}</span></div>
      <div class="hero-fig"><b>${st.coverage_pct}<small>%</small></b><span>${full} of ${mapped} met by a tested control</span></div>
      <div class="hbar"><div class="segs">${segs.filter(s => s[1]).map(([l, n, c]) =>
          `<i style="width:${100 * n / total}%;background:${c}" data-tip="<b>${l}</b>: ${n} of ${total}"></i>`).join('')}</div>
        ${target ? `<div class="tgt" style="left:${target}%"><span>Target ${target}%</span></div>` : ''}</div>
      <div class="hlegend">${segs.map(([l, n, c]) => `<span><i style="background:${c}"></i>${l} <b>${n}</b></span>`).join('')}</div></div>`;

  const ctrls = [...S.controls].sort((a, b) => a.effectiveness - b.effectiveness);
  const cState = c => c.effectiveness < 0.6 ? ['var(--crit)', 'Failing'] : c.effectiveness < 0.9 ? ['var(--warn)', 'Weak'] : ['var(--good)', 'Effective'];
  const tile = (lbl, v, nt, viz, page) => `<div class="stile" data-go="${page}" tabindex="0" role="link">
      <div class="lb">${lbl}</div><div class="v">${v}</div><div class="nt">${nt}</div><div class="viz">${viz}</div></div>`;
  const heroB = `<div class="hero-b">`
    + tile('Open gaps', st.gap, `${sev.critical || 0} critical · ${sev.high || 0} high`,
        `<div class="sevbar">${SEV.filter(s => sev[s]).map(s => `<i style="flex:${sev[s]};background:${SEV_COLOR[s]}" data-tip="<b>${cap(s)}</b>: ${sev[s]} gaps"></i>`).join('')}</div>`, 'gaps')
    + tile('Controls failing tests', `${st.failing_controls}<small>of ${st.control}</small>`, `${st.contradicted_controls} contradict the owner’s own result`,
        `<div class="cgrid" style="grid-template-columns:repeat(${ctrls.length},minmax(0,1fr))">${ctrls.map(c => { const [col, word] = cState(c);
          const tip = `<b>${esc(c.control_ref)}</b> · ${word}<br>Owner says: ${esc(c.test_result || '—')}<br>Independent test: ${esc(c.independent_result || '—')}`;
          return `<i style="background:${col}" data-tip="${esc(tip)}"></i>`; }).join('')}</div>`, 'controls')
    + tile('Proven from source', `${st.verification_pct}<small>%</small>`, `${st.verified_obligations} of ${st.obligation} obligations re-slice exactly`,
        `<div class="proof" aria-hidden="true" style="margin-top:0"><i></i><i class="hit"></i><i></i><i></i>${I.check}</div>`, 'verify')
    + `</div>`;

  // Priority actions: one line per gap, ranked by risk.
  const top = S.gaps.slice(0, 6);
  const clean = s => (s || '').replace(/\s+/g, ' ').replace(/^\W*(?:\(\w+\)|\d+[A-Z]?\.)\s*/, '').trim();
  const rows = top.map(g => `<div class="row" data-ob="${g.obligation_id}" tabindex="0" role="button">
      <span class="chip ${g.severity}"><span class="d"></span>${cap(g.severity)}</span>
      <span class="ref">${esc(refLabel(g.regulator, g.clause_ref))}</span>
      <div style="min-width:0"><div class="t">${esc(clean(g.excerpt))}</div>
        <div class="s">${esc(AREA_NAME(g.category))} · ${esc(GAP_TYPE[g.gap_type] || g.gap_type)}${g.control_ref ? ' · ' + esc(g.control_ref) : ''} · ${esc(g.owner_role || '')}</div></div>
      <span class="due ${g.overdue ? 'late' : ''}">${g.overdue ? 'Overdue' : esc(fmtDate(g.due_date))}<small>${g.overdue ? 'since ' + esc(fmtDate(g.due_date)) : 'due'}</small></span>
      <span class="chev">${I.chev}</span></div>`).join('');

  // Gaps by area: where the open gaps cluster, by severity.
  const byCat = groupBy(S.gaps, g => g.category);
  const cats = Object.keys(byCat).sort((a, b) => (a === 'other') - (b === 'other') || byCat[b].length - byCat[a].length);
  const maxN = Math.max(1, ...cats.map(c => byCat[c].length));
  const areas = `<div class="alegend">${SEV.map(s => `<span><i style="background:${SEV_COLOR[s]}"></i>${cap(s)}</span>`).join('')}</div>
    <div class="areas">${cats.map(c => { const n = groupCount(byCat[c], g => g.severity);
      return `<div class="area" data-act="area" data-cat="${esc(c)}" tabindex="0" role="button">
        <span class="nm">${esc(AREA_NAME(c))}</span>
        <div class="bar" style="width:${100 * byCat[c].length / maxN}%">${SEV.filter(s => n[s]).map(s =>
          `<i style="flex:${n[s]};background:${SEV_COLOR[s]}" data-tip="<b>${esc(AREA_NAME(c))}</b><br>${cap(s)}: ${n[s]}"></i>`).join('')}</div>
        <span class="n">${byCat[c].length}</span></div>`; }).join('')}</div>`;

  const links = [
    ['Regulations', st.regulation, 'IngestionAgent', 'sources'], ['Obligations', st.obligation, 'ObligationAgent', 'obligations'],
    ['Applicability', st.applicable, 'ApplicabilityAgent', 'profile'], ['Controls', st.control, 'ControlAgent', 'controls'],
    ['Evidence', st.evidence, 'ControlAgent', 'controls'], ['Testing', st.control_test, 'TestingAgent', 'controls'],
    ['Gaps', st.gap, 'GapAgent', 'gaps'], ['Remediation', st.remediation, 'GapAgent', 'remediation'],
    ['Monitoring', st.monitor_alert, 'MonitoringAgent', 'monitoring']];

  return header
    + `<section class="card hero">${heroA}${heroB}</section>`
    + `<div class="grid g-7-5">`
    + card('Priority actions', `<div class="risks">${rows}</div>`,
        {flush:true, sub:`Top ${top.length} of ${st.gap} open gaps, ranked by risk`, right:`<button class="btn sm ghost" data-go="gaps">All issues ${I.arrow}</button>`})
    + `<div class="stack">`
    + card('Gaps by area', areas + `<p class="muted" style="font-size:11.5px;margin-top:16px">Select an area to open its gaps.</p>`,
        {sub:`${st.gap} open gaps`})
    + changesCard()
    + `</div></div>`
    + `<div class="mt">` + card('How it works', `<div class="flowwrap"><div class="flow"><div class="track"><i></i></div>${links.map(([l, n, a, p]) =>
        `<button class="fnode" data-go="${p}" data-tip="<b>${l}</b><br>Owned by ${a}"><span class="dot num">${n ?? 0}</span><span class="fl">${l}</span></button>`).join('')}</div></div>`,
        {sub:'Select a step to open it', flush:true}) + `</div>`;
};
function changesCard(){
  const prior = (S.docs || []).find(d => d.kind === 'prior');
  const v = /Updated as on (.+)/.exec(prior?.version || '');
  const since = v && !isNaN(new Date(v[1])) ? new Date(v[1]).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : 'the previous version';
  const rows = S.changes.slice(0, 3).map(c => {
    const moved = /→/.test(c.summary);
    return `<div class="chg" data-go="changes" tabindex="0" role="link">
      <span class="ref">${esc(refLabel(c.regulator, c.clause_path))}</span>
      <div style="min-width:0"><div class="t">${esc(cap(c.change_type))}${moved ? ' · a number moved' : ' · wording only'}</div>
        <div class="s">${c.affected_count ? `${c.affected_count} obligation${c.affected_count > 1 ? 's' : ''} re-assessed` : 'No obligations affected'}</div></div>
      <span class="chip ${moved ? 'high' : 'low'}"><span class="d"></span>${moved ? 'Review' : 'Low impact'}</span></div>`;
  }).join('');
  return card('What changed', rows || `<div class="empty" style="padding:18px 16px">No changes against ${esc(since)}.</div>`,
    {flush:true, sub:`vs ${esc(since)}`, right:`<button class="btn sm ghost" data-go="changes">Details ${I.arrow}</button>`});
}
ACTIONS.area = t => { (UI.f.gap ||= {}).cat = t.dataset.cat; UI.heat = null; go('gaps'); };

/* ---------------------------------------------------------------- Ask Accentic */
const QA_SUGGEST = [
  'How long must transaction records be kept?',
  'What must we do to screen customers against UN sanctions lists?',
  'Do we need senior management approval for PEP relationships?',
  'What is required to identify beneficial owners of companies?',
];
UI.qa = [];
const botMsg = (inner, isNew, foot = '') => `<div class="msg bot${isNew ? ' new' : ''}"><div class="avatar">${logo()}</div>
  <div class="body"><div class="bubble">${inner}</div>${foot}</div></div>`;
function answerHtml(a, i, isNew){
  if(!a) return botMsg(`<span class="typing" aria-label="Accentic is answering"><i></i><i></i><i></i></span>
    <span class="muted" style="font-size:12px;margin-left:6px">Reading the regulations…</span>`, isNew);
  if(a.error) return botMsg(`<div class="callout crit">${I.warn}<div>${esc(a.error)}</div></div>`, isNew);
  const nCites = a.answer.reduce((s, p) => s + p.citations.filter(c => c.kind === 'source').length, 0);
  const intro = a.mode !== 'claude' && a.answer.length
    ? (a.answer.length === 1
        ? `<p>I found 1 requirement that answers this, quoted exactly from the regulation with where the bank stands:</p>`
        : `<p>I found ${a.answer.length} requirements that answer this, each quoted exactly from the regulation with where the bank stands:</p>`) : '';
  const body = a.answer.length ? intro + a.answer.map((p, j) => `<p>${esc(p.text)}</p>
      <div style="margin:-2px 0 10px">${p.citations.map((c, k) => c.kind === 'source'
        ? `<button class="cite" data-act="cite" data-id="q${i}-${j}-${k}" title="Verified: quote found at characters ${c.char_start}–${c.char_end}">${I.ok}${esc(c.ref)}</button>`
        : `<button class="cite f" data-ob="${c.obligation_id}" title="${esc(c.status)}">${I.list}Finding · ${esc(c.ref)}</button>`).join('')}</div>
      ${p.citations.map((c, k) => c.kind === 'source' ? `<div id="q${i}-${j}-${k}" style="display:none;margin:-4px 0 12px"><div class="src" style="max-height:160px"><mark>${esc(c.quote)}</mark></div>
        <div class="muted" style="font-size:11.5px;margin-top:4px">${esc(regShort(c.title, c.regulator))} · characters ${c.char_start}–${c.char_end} · re-located in the source before display</div></div>` : '').join('')}`).join('')
    : `<p>I couldn’t find a binding requirement in the regulations I’ve read that answers this. I only answer from those documents, so I won’t guess. Try asking about record keeping, reporting to FIU-IND, sanctions screening or due diligence.</p>`;
  const extra = [a.rejected_citations ? `${a.rejected_citations} unverifiable citation${a.rejected_citations > 1 ? 's' : ''} removed` : '',
                 a.withheld_paragraphs ? `${a.withheld_paragraphs} unsupported paragraph${a.withheld_paragraphs > 1 ? 's' : ''} withheld` : ''].filter(Boolean).join(' · ');
  const foot = `<div class="msg-foot">
      <span class="chip ${nCites ? 'good' : 'neutral'}">${nCites ? `${I.ok}${nCites} citation${nCites === 1 ? '' : 's'} verified` : 'No citations'}</span>
      <span>${a.mode === 'claude' ? 'Claude Opus 5.5' : 'Rule engine (no API key)'}${extra ? ' · ' + esc(extra) : ''}</span>
      ${a.sources.length ? `<details><summary>${a.sources.length} clauses searched</summary>${a.sources.map(s => esc(s.ref)).join(', ')}</details>` : ''}
      ${a.answer.length ? `<button class="iconbtn" data-act="copyans" data-i="${i}" aria-label="Copy answer" title="Copy answer">${I.copy}</button>` : ''}
    </div>`;
  return botMsg(body, isNew, foot);
}
/* The assistant lives in a floating panel, outside #view, so it stays open across pages. */
const CHAT = {open:false, built:false};
function buildChat(){
  const p = $('#chatPanel');
  p.innerHTML = `<header class="chat-head"><div class="avatar">${logo()}</div>
      <div><b>Accentic</b><small>Compliance assistant · cites the exact source</small></div>
      <div class="acts"><button class="newc" data-act="newchat" aria-label="New chat" title="New chat">${I.plus}</button>
        <button data-act="chatclose" aria-label="Close" title="Close (Esc)">${I.x}</button></div></header>
    <div class="chat-body" id="qaLog" aria-live="polite"></div>
    <div class="composer"><form id="qaForm"><textarea id="qaIn" rows="1" placeholder="Message Accentic…" aria-label="Your question"></textarea>
      <button class="send" id="qaSend" type="submit" aria-label="Send">${I.send}</button></form>
      <div class="hint">Answers come only from the regulations Accentic has read</div></div>`;
  const inp = $('#qaIn');
  const grow = () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 120) + 'px'; };
  inp.oninput = grow;
  $('#qaForm').onsubmit = e => { e.preventDefault(); ask(inp.value); };
  inp.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(inp.value); } };
  CHAT.grow = grow;
  CHAT.built = true;
}
function renderChat(){
  if(!CHAT.built) return;
  const last = UI.qa.length - 1;
  $('#qaLog').innerHTML = UI.qa.length
    ? UI.qa.map((x, i) => `<div class="msg user${i === last && !x.a ? ' new' : ''}"><div class="bubble">${esc(x.q)}</div></div>${answerHtml(x.a, i, i === last)}`).join('')
    : `<div class="welcome"><div class="msg bot"><div class="avatar">${logo()}</div><div class="bubble"><b>Hi, I’m Accentic.</b>Ask me about your obligations in plain English. I answer only from the regulations I’ve read, and every citation is checked against the source before you see it.</div></div>
        <div class="suggest">${QA_SUGGEST.map(q => `<button data-act="askq" data-v="${esc(q)}">${esc(q)}${I.arrow}</button>`).join('')}</div></div>`;
  $('#chatPanel').classList.toggle('has', UI.qa.length > 0);
  $('#qaSend').disabled = !!UI.qaBusy;
  $('#qaLog').scrollTop = $('#qaLog').scrollHeight;
}
function openChat(){
  if(!CHAT.built) buildChat();
  renderChat();
  CHAT.open = true;
  const p = $('#chatPanel'), fab = $('#chatFab');
  p.classList.add('on'); p.setAttribute('aria-hidden', 'false');
  fab.classList.add('open', 'seen'); fab.classList.remove('unread');
  fab.setAttribute('aria-expanded', 'true'); $('#fabIco').innerHTML = I.x;
  localStorage.setItem('accentic-chat-seen', '1');
  setTimeout(() => $('#qaIn')?.focus(), 180);
}
function closeChat(){
  CHAT.open = false;
  const p = $('#chatPanel'), fab = $('#chatFab');
  p.classList.remove('on'); p.setAttribute('aria-hidden', 'true');
  fab.classList.remove('open'); fab.setAttribute('aria-expanded', 'false'); $('#fabIco').innerHTML = I.chat;
}
ACTIONS.chattoggle = () => CHAT.open ? closeChat() : openChat();
ACTIONS.chatclose = () => { closeChat(); $('#chatFab').focus(); };
async function ask(q){
  q = (q || '').trim();
  if(q.length < 3 || UI.qaBusy) return;
  if(!hasData()){ toast('Run the analysis first so there is something to answer from.'); return; }
  const entry = {q, a:null};
  UI.qa.push(entry); UI.qaBusy = true;
  $('#qaIn').value = ''; CHAT.grow();
  renderChat();
  try{ entry.a = await api('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q})}); }
  catch(err){ entry.a = {error: err.message}; }
  UI.qaBusy = false;
  renderChat();
  if(!CHAT.open) $('#chatFab').classList.add('unread');
}
ACTIONS.askq = t => ask(t.dataset.v);
ACTIONS.newchat = () => { UI.qa = []; renderChat(); $('#qaIn').focus(); };
ACTIONS.copyans = async t => {
  const a = UI.qa[+t.dataset.i]?.a;
  if(!a) return;
  try{ await navigator.clipboard.writeText(a.answer.map(p => p.text).join('\n\n')); toast('Answer copied.'); }
  catch{ toast('Copy is not available in this browser.'); }
};
ACTIONS.cite = t => { const el = document.getElementById(t.dataset.id); if(el) el.style.display = el.style.display === 'none' ? '' : 'none'; };
AFTER.overview = () => {
  if(hasData() && !localStorage.getItem('accentic-tour-done') && TOURSTATE.i < 0)
    setTimeout(() => route() === 'overview' && TOURSTATE.i < 0 && startTour(), 600);
};

PAGES.sources = () => {
  const docs = S.docs || [];
  const stateChip = s => ({current:'<span class="chip good"><span class="d"></span>Unchanged</span>',
    changed:'<span class="chip medium"><span class="d"></span>Changed</span>', new:'<span class="chip info"><span class="d"></span>Not yet analysed</span>'}[s] || '');
  return head('Sources & regulatory library',
      'The two inputs the problem defines: regulatory documents relevant to the bank, and its internal controls and policies. Every document is fingerprinted, so a change is detected even when nobody announces it.')

    + card('Add a document', `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><label for="upKind" style="font-size:12.5px;color:var(--ink-2)">Document type</label>
        <select class="sel" id="upKind"><option value="regulation">Regulation (PDF or text)</option><option value="control">Control framework / policy</option></select></div>
      <div class="drop" id="drop">${I.upload}<div><b>Drop a PDF or text file here</b></div><div class="muted" style="font-size:12px;margin:4px 0 10px">Up to 20 MB · the next analysis ingests it automatically</div>
        <label class="btn sm" for="upFile">Choose file</label><input type="file" id="upFile" accept=".pdf,.txt" class="sr"></div>
      <p class="muted" style="font-size:12px;margin-top:10px">Regulations are split on clause numbering, never on token count, and every clause keeps exact character offsets. Control documents are parsed from <span class="mono">CTRL-XXX-NNN | Title</span> blocks; anything that cannot be parsed goes to human review rather than being dropped.</p>`)
    + card('Document inventory', table('docs', [
        {k:'name', h:'Document', r:d => `<div style="font-weight:600">${esc(d.title || d.name)}</div>`
          + (d.version ? `<div class="ink2" style="font-size:12px">${esc(d.version)}</div>` : '')
          + (d.official_url ? `<div style="font-size:12px"><a href="${esc(d.official_url)}" target="_blank" rel="noopener">Official source: ${esc(d.publisher || new URL(d.official_url).host)} ↗</a>${d.retrieved_on ? ` <span class="muted">· downloaded ${esc(fmtDate(d.retrieved_on))}</span>` : ''}</div>` : '')
          + `<div class="muted mono" style="font-size:11px">${esc(d.path)}</div>`},
        {k:'kind', h:'Type', r:d => `<span class="tag">${esc(KIND_LABEL[d.kind] || d.kind)}</span>`},
        {k:'format', h:'Format'},
        {k:'bytes', h:'Size', cls:'n', r:d => fmtBytes(d.bytes)},
        {k:'sections', h:'Extracted', cls:'n', r:d => d.sections != null ? `${d.sections} clauses · ${d.obligations} obligations` : d.controls != null ? `${d.controls} controls` : '<span class="muted">—</span>'},
        {k:'state', h:'Since last run', r:d => stateChip(d.state)},
        {k:'sha256', h:'Fingerprint', r:d => `<span class="mono muted">${esc(d.sha256)}</span>`},
        {k:'act', h:'', sort:false, r:d => d.uploaded ? `<button class="iconbtn" data-act="rmdoc" data-path="${esc(d.path)}" aria-label="Remove ${esc(d.name)}" title="Remove">${I.trash}</button>` : ''},

    + `<div class="mt">` + card('Regulatory library', hasData() ? `<div class="grid" style="grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0">

        <div style="padding:16px;max-height:560px;overflow:auto" id="libDetail"><div class="empty">Select a clause to see its exact position in the source and the offset check.</div></div></div>` : needRun(),
        {flush:true, sub:'Clause-level index with offset verification', right: hasData() ? `<select class="sel" id="libReg">${S.regs.map(r => `<option value="${r.id}">${esc(regShort(r.title, r.regulator))} · ${r.sections} clauses</option>`).join('')}</select>` : ''}) + `</div>`;

AFTER.sources = () => {
  const drop = $('#drop'), file = $('#upFile');
  const send = async f => {
    if(!f) return;
    const kind = $('#upKind').value;
    try{
      const r = await send(`/api/documents?kind=${kind}&filename=${encodeURIComponent(f.name)}`, {method:'POST', body:f});
      const b = await r.json();
      if(!r.ok) throw new Error(b.detail || r.statusText);
      toast(`Added ${f.name}. Run the analysis to ingest it.`);
      S.docs = await api('/api/documents'); render(); pollDrift();
    }catch(err){ toast('Upload failed: ' + err.message); }

ACTIONS.rmdoc = async t => {
  if(!confirm('Remove this uploaded document? It will be excluded from the next analysis.')) return;
  try{ await api('/api/documents?path=' + encodeURIComponent(t.dataset.path), {method:'DELETE'}); }
  catch(err){ toast(err.message); return; }
  S.docs = await api('/api/documents'); render(); pollDrift();
};
async function loadLibrary(regId){
  const secs = await api('/api/sections?regulation_id=' + regId);
  const reg = S.regs.find(r => r.id === regId) || {};
  const obs = groupCount(S.obligations.filter(o => o.regulation_title === reg.title), o => o.section_id);
  $('#libList').innerHTML = secs.map(s => `<div class="finding" data-act="sec" data-id="${s.id}" tabindex="0" role="button" style="grid-template-columns:1fr;padding:10px 14px">

/* ---------------------------------------------------------------- Change intelligence */
function wordDiff(a, b){
  const A = (a || '').split(/(\s+)/), B = (b || '').split(/(\s+)/);
  const n = A.length, m = B.length;
  const dp = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--)
    dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, left = '', right = '';
  while(i < n && j < m){
    if(A[i] === B[j]){ left += esc(A[i]); right += esc(B[j]); i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]){ left += /\S/.test(A[i]) ? `<del>${esc(A[i])}</del>` : esc(A[i]); i++; }
    else { right += /\S/.test(B[j]) ? `<ins>${esc(B[j])}</ins>` : esc(B[j]); j++; }
  }
  while(i < n){ left += /\S/.test(A[i]) ? `<del>${esc(A[i])}</del>` : esc(A[i]); i++; }
  while(j < m){ right += /\S/.test(B[j]) ? `<ins>${esc(B[j])}</ins>` : esc(B[j]); j++; }
  return [left, right];
}

        right:`<div class="legend">${COV_SEG.map(([k, l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`})
    + `<div>` + card('Coverage outcome', COV_SEG.map(([k, l, c]) => `<div class="trow"><span class="statusdot" style="background:${c}"></span><div class="tl">${l}</div><b class="num">${counts[k] || 0}</b></div>`).join('')

        ['3', 'Strong match and passes testing?', 'No', 'partial', 'Full coverage needs a score of at least 0.20 and independent effectiveness of at least 90%.'],

const me = () => localStorage.getItem('accentic-reviewer') || '';
function whoAmI(){
  let n = me();

}
async function setTask(obligationId, patch){
  const author = whoAmI();
  if(!author) return false;
  try{ await api('/api/tasks', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({obligation_id:obligationId, author, ...patch})}); }
  catch(err){ toast('Could not update: ' + err.message); return false; }
  S.gaps = await api('/api/gaps');
  return true;
}

PAGES.simulate = () => {
  if(!hasData()) return head('What-if simulation', '') + card('Simulation', needRun());
  const sim = UI.sim;
  return head('What-if simulation',
      'Describe a hypothetical regulatory change. The SimulationAgent matches it to live obligations and walks the chain (obligation → mapping → control → gap) to size the blast radius before the change is published.')

    + `<div id="simOut" class="mt">${sim ? simResult(sim) : ''}</div>`;

function simResult(sim){
  const r = sim.result, s = r.summary || {};

function sparkline(points, key, label, fmt = v => v){
  const W = 300, H = 92, pl = 30, pr = 12, pt = 12, pb = 22;
  const vals = points.map(p => p[key]);
  const lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
  const x = i => pl + (points.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (points.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo || 1));
  const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join('');
  const last = points[points.length - 1];
  const ticks = [lo, hi];
  return `<div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span style="font-size:12.5px;color:var(--ink-2)">${esc(label)}</span><b style="font-size:18px">${esc(fmt(last[key]))}</b></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)} across the last ${points.length} runs">
      ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${esc(fmt(Math.round(t * 10) / 10))}</text>`).join('')}
      ${points.length > 1 ? `<path d="${path}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
      ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[key])}" r="${i === points.length - 1 ? 4 : 3}" fill="var(--series)" stroke="var(--chart)" stroke-width="2"/>
        <circle cx="${x(i)}" cy="${y(p[key])}" r="11" fill="transparent" data-tip="<b>Run ${i + 1}</b> · ${esc(fmtTime(p.captured_at))}<br>${esc(label)}: ${esc(fmt(p[key]))}"/>`).join('')}
      <text x="${pl}" y="${H - 6}">run 1</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">run ${points.length}</text>
    </svg></div>`;
}

const AGENT_PLAN = [
  ['IngestionAgent','Parse regulations and compute verifiable character offsets'],
  ['ObligationAgent','Extract obligations and anchor every one to its source'],
  ['ApplicabilityAgent','Decide which obligations bind this bank, and which units own them'],
  ['ControlAgent','Parse the bank control framework and link evidence'],
  ['TestingAgent','Re-perform control tests from evidence, not owner say-so'],
  ['MappingAgent','Map applicable obligations to controls, discounted by test results'],
  ['GapAgent','Score gaps by impact × likelihood and recommend remediation'],
  ['ContradictionAgent','Detect conflicting requirements across regulations'],
  ['ChangeAgent','Diff against the prior version and size the impact'],
  ['AssuranceAgent','Check the chain’s invariants and self-correct once'],
  ['WorkflowAgent','Reconcile remediation tasks with this run’s findings'],
  ['MonitoringAgent','Compare with the last run, raise alerts, record KRIs'],
];
function agentState(){
  const logged = groupBy(S.runs.filter(r => !['simulation', 'on-demand'].includes(r.run_id)), r => r.agent_name);
  return AGENT_PLAN.map(([name, goal]) => {
    const live = RUN.agents[name], runs = logged[name] || [];
    const status = live ? live.status : runs.length ? (runs.some(r => r.status === 'failed') ? 'failed' : 'done') : 'pending';
    let tools = [];
    runs.forEach(r => { try{ JSON.parse(r.tool_calls || '[]').forEach(t => tools.includes(t) || tools.push(t)); }catch{} });
    const step = (RUN.plan || []).find(s => s.agent === name);
    return {name, goal, status, live, runs, tools,
      reason: step?.reason || (runs[0]?.input_summary ? 'Input: ' + runs.map(r => r.input_summary).join(' · ') : ''),
      ms: live?.ms ?? runs.reduce((s, r) => s + r.duration_ms, 0),
      model: runs.map(r => r.model).find(Boolean),
      reasoning: runs[0]?.reasoning, outputs: runs.map(r => r.output_summary).filter(Boolean)};
  });
}

    `<button class="btn primary" data-run ${RUN.running ? 'disabled' : ''}>${I.play}${hasData() ? 'Re-run analysis' : 'Run analysis'}</button>`)
  + `<section class="card"><div class="hd"><h3>Pipeline</h3><span class="sub" id="agSub"></span></div><div class="pipe" id="agPipe"></div></section>`

    const A = agentState();
    const done = A.filter(a => a.status === 'done').length;
    $('#agSub').textContent = RUN.running ? `Running · ${done} of ${A.length} complete` : RUN.error ? 'Last run failed: ' + RUN.error : hasData() ? `Last run ${fmtTime(S.stats.last_run)} · mode: ${S.stats.mode === 'claude' ? 'Claude Opus 5.5' : 'rule engine'}` : 'Not yet run';
    $('#agPipe').innerHTML = A.map(a => `<div class="pnode ${a.status}"><span class="s"></span><b>${esc(a.name.replace('Agent', ''))}</b><span>${esc(AGENT_META[a.name].link)}</span></div>`).join('');
    $('#agList').innerHTML = A.map(a => {
      const chips = a.live && Object.keys(a.live.out).length
        ? Object.entries(a.live.out).map(([k, v]) => `<span class="chip ${k === 'rejected' && v > 0 || k === 'exceptions' && v > 0 || k === 'contradicted' && v > 0 ? 'high' : 'neutral'}">${esc(k.replace(/_/g, ' '))}: <b>${esc(v)}</b></span>`).join('')
        : a.outputs.map(o => `<span class="chip neutral">${esc(o)}</span>`).join('');
      const notes = (a.live?.notes || []).filter(n => !/^ingested/.test(n));
      return `<div class="agent ${a.status}"><div class="ic">${a.status === 'running' ? I.spin : a.status === 'done' ? I.ok : a.status === 'failed' ? I.x : I.cpu}</div>
        <div><h4>${esc(a.name)} <span class="tag">${esc(AGENT_META[a.name].link)}</span></h4><div class="goal">${esc(a.goal)}</div>
          ${a.reason ? `<div class="muted" style="font-size:12px;margin-top:2px">${step_label(a)} ${esc(a.reason)}</div>` : ''}
          ${chips ? `<div class="out">${chips}</div>` : ''}
          ${notes.length ? `<div class="out">${notes.map(n => `<span class="chip medium"><span class="d"></span>${esc(n)}</span>`).join('')}</div>` : ''}
          ${a.reasoning && a.status !== 'running' ? `<div class="why">${esc(a.reasoning)}</div>` : ''}
          ${a.tools.length && a.status !== 'running' ? `<div class="tools">${a.tools.map(t => `<span class="fn">${esc(t)}()</span>`).join('')}${a.model ? `<span class="fn m">${esc(a.model)}</span>` : ''}</div>` : ''}
          ${a.live?.error ? `<div class="callout crit" style="margin-top:8px">${esc(a.live.error)}</div>` : ''}</div>
        <div class="ms">${a.ms ? a.ms + ' ms' : ''}</div></div>`;
    }).join('');
  };
  UI.refresh();
};

/* =====================================================================

const PAL = {items:[], hits:[], i:0};
const RECENT = [];   // obligations opened this session, newest first
function remember(o){
  const t = `${refLabel(o.regulator, o.clause_ref)} · ${(o.obligation_text || '').replace(/\s+/g, ' ')}`;
  const i = RECENT.findIndex(r => r.ob === o.id);
  if(i >= 0) RECENT.splice(i, 1);
  RECENT.unshift({t, s:'opened recently', ob:o.id});
  RECENT.length = Math.min(RECENT.length, 5);
}
function paletteIndex(){
  const items = [];
  ALL_SECTIONS.forEach(sec => sec.pages.forEach(([id, label]) => items.push({k:'Page', t:`${sec.label} › ${label}`, s:PAGE_HELP[id], go:id})));
  items.push({k:'Assistant', t:'Ask Accentic', s:'Plain-English answers with verified citations', go:'ask'});
  items.push({k:'Help', t:'How to use Accentic', s:'Sections explained, glossary of terms, shortcuts', help:true});
  items.push({k:'Action', t:'Run the analysis', s:'Re-assess every regulation and control', run:true});
  items.push({k:'Action', t:'Open the board report', s:'Print, save as PDF or download Word', url:'/api/report'});
  items.push({k:'Action', t:'Take the guided tour', s:'Two-minute walkthrough', tour:true});
  S.obligations.forEach(o => items.push({k:'Obligation', t:`${refLabel(o.regulator, o.clause_ref)} · ${o.obligation_text.replace(/\s+/g, ' ')}`, s:`${CAT[o.category] || ''}${o.severity ? ' · ' + o.severity + ' gap' : ''}`, ob:o.id}));
  S.controls.forEach(c => items.push({k:'Control', t:`${c.control_ref} · ${c.title}`, s:`${c.owner} · ${c.independent_result || ''}`, go:'controls'}));
  S.gaps.forEach(g => items.push({k:'Task', t:`${refLabel(g.regulator, g.clause_ref)} · ${g.action}`, s:`${g.severity} · ${g.task_status.replace('_', ' ')} · ${g.assignee || g.owner_role}`, ob:g.obligation_id}));
  (S.monitoring.alerts || []).forEach(a => items.push({k:'Alert', t:a.title, s:a.severity, go:'monitoring'}));
  return items;
}
function paletteSearch(q){
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return [...RECENT.map(r => ({...r, k:'Recent'})),
    ...PAL.items.filter(x => x.k === 'Page' || x.k === 'Action' || x.k === 'Help')].slice(0, 30);
  return PAL.items.map(x => {
    const hay = (x.t + ' ' + x.s + ' ' + x.k).toLowerCase();
    if(!terms.every(t => hay.includes(t))) return null;
    // Whole-word and word-start matches outrank matches inside a word ("STR" vs "inSTRument").
    const wordScore = terms.reduce((s, t) => {
      const re = new RegExp('\\b' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      return s + (re.test(hay) ? (new RegExp(re.source + '\\b').test(hay) ? -2000 : -1000) : 0);
    }, 0);
    return [x, wordScore + (x.k === 'Page' ? -50 : 0) + terms.reduce((s, t) => s + hay.indexOf(t), 0)];
  }).filter(Boolean).sort((a, b) => a[1] - b[1]).slice(0, 40).map(x => x[0]);
}
function paintPalette(){
  $('#pList').innerHTML = PAL.hits.map((x, i) => `<div class="pitem ${i === PAL.i ? 'on' : ''}" data-pi="${i}" role="option" aria-selected="${i === PAL.i}">
    <span class="k">${esc(x.k)}</span><span class="t">${esc(x.t)}</span><span class="muted" style="font-size:11.5px;white-space:nowrap">${esc(x.s)}</span></div>`).join('')
    || '<div class="empty" style="padding:24px">Nothing matches.</div>';
  $('#pList .pitem.on')?.scrollIntoView({block:'nearest'});
}
function openPalette(){
  PAL.items = paletteIndex(); PAL.i = 0; PAL.hits = paletteSearch('');
  $('#palette').classList.add('on'); $('#pIn').value = ''; paintPalette(); $('#pIn').focus();
}
function closePalette(){ $('#palette').classList.remove('on'); }
function choosePalette(x){
  closePalette();
  if(!x) return;
  if(x.ob) openObligation(x.ob);
  else if(x.go) go(x.go);
  else if(x.run) runAnalysis();
  else if(x.url) window.open(x.url, '_blank', 'noopener');
  else if(x.tour) startTour();
  else if(x.help) openHelp();
}

/* =====================================================================
   Guided tour: the demo story, in eight stops
   ===================================================================== */
const TOUR = [
  {r:'overview', sel:'#nav', t:'Five places, each answering one question', b:'Issues & actions: what is wrong and who is fixing it. Regulations: what the rules require. Our controls: how well we meet them. Monitoring & proof: alerts and evidence. Pages inside each place appear as tabs at the top.'},
  {r:'overview', sel:'.hero-a', t:'The verdict first', b:'One number: how many obligations in scope are fully met by a tested control, against the bank’s target. The bar shows where the rest stand. The Help button explains every term you will see.'},
  {r:'overview', sel:'.hero-b', t:'Three numbers behind it', b:'Open gaps by severity, controls that fail independent testing (one square per control), and how much of the register is proven from source. Every number links to the register behind it.'},
  {r:'overview', sel:'.flow', t:'The chain the problem defines', b:'Regulations → obligations → applicability → controls → evidence → testing → gaps → remediation → monitoring. Hover a step to see the agent that owns it.'},
  {r:'overview', sel:'.risks', t:'What to fix first', b:'The highest-risk gaps, each quoting the clause it comes from. Select one to open its full traceability chain, from the exact clause text through to the remediation task.'},
  {r:'overview', sel:'#chatFab', t:'Ask in plain English, from any page', b:'The chat button opens Accentic’s assistant. Answers come only from the ingested regulations, and each citation is located word for word in the source before it is shown.'},
  {r:'verify', sel:'#claim', t:'Try to break it', b:'Paste a real sentence and it resolves to its clause and offsets. Change one number and it is rejected. This is the same gate the pipeline uses.'},
  {r:'controls', sel:'.callout.crit', t:'The owner says effective. The evidence disagrees.', b:'Control tests are re-performed from the evidence, so a self-assessed “Effective” cannot hide a breached deadline.'},
  {r:'remediation', sel:'.board', t:'Remediation that closes only when verified', b:'Drag tasks between columns. A task marked done is re-opened automatically if the next run still detects the gap.'},
  {r:'monitoring', sel:'.card', t:'It never goes stale', b:'Source documents are fingerprinted. Change a regulation and drift is flagged within seconds; the next run names exactly what moved.'},
  {r:'coverage', sel:'.nine', t:'Mapped to the problem statement', b:'All 14 features, the supporting features, the nine-blocker position and the evaluation criteria, with live evidence.'},
  {r:'overview', sel:'#reportBtn', t:'A board pack in one click', b:'Executive report with findings, risk profile, the remediation plan and the assurance trail. Print to PDF or download for Word.'},
];
const TOURSTATE = {i:-1};
function startTour(){ TOURSTATE.i = 0; showTourStep(); }
function endTour(){
  TOURSTATE.i = -1; localStorage.setItem('accentic-tour-done', '1');
  $('#tourRing')?.remove(); $('#tourCard')?.remove();
}
async function showTourStep(){
  const s = TOUR[TOURSTATE.i];
  if(!s){ endTour(); return; }
  closeDrawer();
  if(route() !== s.r){ go(s.r); await new Promise(r => setTimeout(r, 350)); }
  const el = document.querySelector(s.sel) || $('#view .phead');
  el.scrollIntoView({block:'center'});
  await new Promise(r => setTimeout(r, 120));
  const rc = el.getBoundingClientRect();
  let ring = $('#tourRing'), cardEl = $('#tourCard');
  if(!ring){ ring = document.createElement('div'); ring.id = 'tourRing'; ring.className = 'tour-ring'; document.body.append(ring); }
  if(!cardEl){ cardEl = document.createElement('div'); cardEl.id = 'tourCard'; cardEl.className = 'tour-card'; cardEl.setAttribute('role', 'dialog'); document.body.append(cardEl); }
  const pad = 6;
  Object.assign(ring.style, {left:rc.left - pad + 'px', top:rc.top - pad + 'px', width:rc.width + pad * 2 + 'px', height:Math.min(rc.height, innerHeight * .7) + pad * 2 + 'px'});
  cardEl.innerHTML = `<div class="st">Step ${TOURSTATE.i + 1} of ${TOUR.length}</div><h4>${esc(s.t)}</h4><p>${esc(s.b)}</p>
    <div class="nav"><button class="btn sm ghost" data-act="tourend">Skip tour</button><span class="grow"></span>
    ${TOURSTATE.i ? '<button class="btn sm" data-act="tourback">Back</button>' : ''}<button class="btn sm primary" data-act="tournext">${TOURSTATE.i === TOUR.length - 1 ? 'Finish' : 'Next'}</button></div>`;
  const below = rc.top + Math.min(rc.height, innerHeight * .7) + 18;
  if(rc.height > innerHeight * .5 && rc.right + 370 < innerWidth){
    // Tall targets (the sidebar): place the card beside them, not on top.
    cardEl.style.top = Math.max(12, rc.top + 24) + 'px';
    cardEl.style.left = rc.right + 18 + 'px';
  } else {
    cardEl.style.top = (below + 190 < innerHeight ? below : Math.max(12, rc.top - 200)) + 'px';
    cardEl.style.left = Math.min(Math.max(12, rc.left), innerWidth - 352) + 'px';
  }
  cardEl.querySelector('[data-act="tournext"]').focus();
}
ACTIONS.tour = () => startTour();
ACTIONS.tournext = () => { TOURSTATE.i++; showTourStep(); };
ACTIONS.tourback = () => { TOURSTATE.i = Math.max(0, TOURSTATE.i - 1); showTourStep(); };
ACTIONS.tourend = () => endTour();

/* =====================================================================
   Boot
   ===================================================================== */
(function boot(){
  const saved = localStorage.getItem('accentic-theme');
  if(saved) document.documentElement.dataset.theme = saved;
  else if(matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  paintTheme();
  $('#themeBtn').onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('accentic-theme', next);
    paintTheme();
  };
  $('#dClose').innerHTML = I.x;
  $('#dClose').onclick = closeDrawer;
  $('#kIco').innerHTML = I.search; $('#pIco').innerHTML = I.search;
  $('#tourBtn').innerHTML = I.compass; $('#reportBtn').innerHTML = I.report;
  $('#helpBtn').innerHTML = I.help; $('#helpIco2').innerHTML = I.help;
  $('#fabIco').innerHTML = I.chat;
  if(localStorage.getItem('accentic-chat-seen')) $('#chatFab').classList.add('seen');
  const setNav = min => {
    document.documentElement.classList.toggle('navmin', min);
    localStorage.setItem('accentic-navmin', min ? '1' : '');
    $('#navToggle').innerHTML = min ? I.expand : I.collapse;
    $('#navToggle').title = $('#navToggle').ariaLabel = min ? 'Expand the sidebar' : 'Collapse the sidebar';
  };
  setNav(!!localStorage.getItem('accentic-navmin'));
  $('#navToggle').onclick = () => setNav(!document.documentElement.classList.contains('navmin'));
  $('#kBtn').onclick = openPalette;
  $('#tourBtn').onclick = startTour;
  $('#palette').onclick = e => { if(e.target.id === 'palette') closePalette(); };
  $('#pList').onclick = e => { const it = e.target.closest('[data-pi]'); if(it) choosePalette(PAL.hits[+it.dataset.pi]); };
  $('#pIn').oninput = () => { PAL.hits = paletteSearch($('#pIn').value); PAL.i = 0; paintPalette(); };
  $('#pIn').onkeydown = e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); PAL.i = Math.min(PAL.hits.length - 1, PAL.i + 1); paintPalette(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); PAL.i = Math.max(0, PAL.i - 1); paintPalette(); }
    else if(e.key === 'Enter'){ e.preventDefault(); choosePalette(PAL.hits[PAL.i]); }
    else if(e.key === 'Escape'){ closePalette(); }
  };
  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openPalette(); }
    if(e.key === 'Escape' && TOURSTATE.i >= 0) endTour();
  });
  window.addEventListener('resize', () => { if(TOURSTATE.i >= 0) showTourStep(); });
  $('#runBtn').onclick = runAnalysis;
  window.addEventListener('hashchange', () => { closeDrawer(); render(); $('#view').scrollTop = 0; });
  paintRunButton();
  loadAll().then(() => { paintRunButton(); render(); paintDrift(); });
  setInterval(pollDrift, 15000);
})();
</script>
