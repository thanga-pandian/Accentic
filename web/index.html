<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Accentic — Agentic Regulatory Compliance</title>
<style>
:root{
  --bg:#06070b; --bg2:#0a0c12;
  --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --ink:#f2f4f8; --ink2:#a8b0c0; --muted:#6b7488;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; --cy:#22d3ee;
  --glow:0 0 28px rgba(57,135,229,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
::-webkit-scrollbar-track{background:transparent}

/* Content must never depend on an animation completing to become visible. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:1ms!important;animation-delay:0ms!important;
    animation-iteration-count:1!important;transition-duration:1ms!important;
  }
  #bg{display:none}
}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.aura{
  position:fixed;border-radius:50%;filter:blur(110px);opacity:.3;z-index:0;pointer-events:none;
}
.aura.a{width:620px;height:620px;background:#1d4ed8;top:-280px;left:-180px;animation:drift1 24s ease-in-out infinite}
.aura.b{width:520px;height:520px;background:#6d28d9;bottom:-260px;right:-140px;animation:drift2 30s ease-in-out infinite}
.aura.c{width:400px;height:400px;background:#0e7490;top:40%;right:18%;opacity:.16;animation:drift1 36s ease-in-out infinite reverse}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,50px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-45px)}}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ============ header ============ */
header{
  display:flex;align-items:center;gap:14px;padding:9px 20px;flex-shrink:0;
  background:rgba(8,10,16,.72);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  width:33px;height:33px;border-radius:10px;flex-shrink:0;position:relative;
  background:linear-gradient(135deg,#3987e5,#9085e9 60%,#22d3ee);
  display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;
  box-shadow:0 0 26px rgba(57,135,229,.55),inset 0 1px 0 rgba(255,255,255,.4);
}
.logo::after{
  content:"";position:absolute;inset:-3px;border-radius:14px;
  background:linear-gradient(135deg,#3987e5,#9085e9,#22d3ee);
  opacity:.4;filter:blur(9px);z-index:-1;animation:breathe 3.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.65}}
.brand h1{
  font-size:17px;font-weight:700;letter-spacing:-.4px;line-height:1.2;
  background:linear-gradient(90deg,#fff,#a8b0c0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.4px;margin-top:-1px}
.spacer{flex:1}

.badge{
  display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;
  font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.badge.live{border-color:rgba(12,163,12,.45);color:#7ee07e}
.badge.live .dot{background:var(--good);box-shadow:0 0 10px var(--good);animation:blip 1.5s infinite}
@keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

.run-btn{
  position:relative;padding:11px 24px;border-radius:11px;font-weight:700;font-size:13.5px;
  color:#fff;background:linear-gradient(135deg,#3987e5,#6d5ce0);overflow:hidden;
  box-shadow:0 4px 22px rgba(57,135,229,.42),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s,box-shadow .18s;
}
.run-btn::before{
  content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  transform:translateX(-100%);
}
.run-btn:hover:not(:disabled)::before{animation:sheen .7s}
@keyframes sheen{to{transform:translateX(100%)}}
.run-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 30px rgba(57,135,229,.6)}
.run-btn:disabled{opacity:.55;cursor:not-allowed}

/* ============ KPI gauges ============ */
/* One row, always. Wrapping to two rows cost ~100px of vertical space and
   squeezed the content area; a horizontal scroll is the cheaper trade. */
.kpis{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);
  gap:8px;padding:9px 20px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;
}
.kpis::-webkit-scrollbar{display:none}
.kpi{
  position:relative;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);
  overflow:hidden;transition:transform .25s,border-color .25s;
  animation:rise .5s backwards;
}
.kpi:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi::after{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--kc,#3987e5),transparent);opacity:.7;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.kpi .ring{width:34px;height:34px;flex-shrink:0;position:relative}
.kpi .ring svg{transform:rotate(-90deg)}
.kpi .ring .rv{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:9px;font-weight:750;color:var(--kc,#3987e5);
}
.kpi .meta{min-width:0}
.kpi .label{
  font-size:8.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  font-weight:700;white-space:nowrap;
}
.kpi .value{font-size:20px;font-weight:750;letter-spacing:-.6px;line-height:1.15;color:var(--kc,#fff)}
.kpi .note{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ nav ============ */
nav{
  display:flex;gap:4px;padding:0 20px 9px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  padding:6px 13px;border-radius:9px;font-size:12px;font-weight:600;color:var(--muted);
  border:1px solid transparent;white-space:nowrap;transition:.2s;
}
nav button:hover{color:var(--ink2);background:var(--glass)}
nav button.on{
  color:#fff;background:linear-gradient(135deg,rgba(57,135,229,.22),rgba(144,133,233,.14));
  border-color:rgba(57,135,229,.42);box-shadow:0 0 18px rgba(57,135,229,.2);
}
nav button .n{
  display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;
  background:rgba(255,255,255,.1);font-size:10px;font-weight:700;
}
nav button.on .n{background:rgba(57,135,229,.4);color:#cfe3fb}

main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:2px 20px 32px;display:none}
.view.on{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}

h2.vh{font-size:16px;font-weight:700;letter-spacing:-.3px;margin-bottom:3px}
p.vs{font-size:12px;color:var(--muted);margin-bottom:13px;max-width:820px;line-height:1.55}

/* ============ glass card ============ */
.card{
  background:var(--glass);border:1px solid var(--line);border-radius:14px;
  padding:15px 17px;margin-bottom:11px;backdrop-filter:blur(14px);transition:.22s;
}
.card:hover{border-color:var(--line2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:1150px){.grid2,.grid3{grid-template-columns:1fr}}

/* ============ pipeline graph ============ */
.flowwrap{
  position:relative;border-radius:16px;overflow:hidden;margin-bottom:16px;
  background:linear-gradient(135deg,rgba(57,135,229,.05),rgba(144,133,233,.03));
  border:1px solid var(--line);backdrop-filter:blur(14px);
}
.flowwrap svg{width:100%;display:block;min-width:860px;max-height:300px}
.flowscroll{overflow-x:auto}

/* ---- narrative flow hero ---- */
.story{
  position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;
  background:
    radial-gradient(900px 220px at 50% 0%,rgba(57,135,229,.10),transparent 70%),
    linear-gradient(135deg,rgba(144,133,233,.05),rgba(34,211,238,.03));
  border:1px solid var(--line);backdrop-filter:blur(14px);
}
.story .inner{overflow-x:auto;scrollbar-width:none}
.story .inner::-webkit-scrollbar{display:none}
.story svg{width:100%;display:block;min-width:1120px;max-height:266px}
@media(max-height:860px){.story svg{max-height:224px}}

/* Negative delay starts each particle mid-flight, so the stream is already
   populated on first paint instead of every dot bunching at the origin. */
.pdot{
  offset-rotate:0deg;animation:travel var(--dur,2.6s) linear infinite;
  animation-delay:var(--dly,0s);animation-fill-mode:backwards;
}
@keyframes travel{
  0%{offset-distance:0%;opacity:0}
  12%{opacity:1}
  88%{opacity:1}
  100%{offset-distance:100%;opacity:0}
}
.stage-box{transition:all .45s}
.stage.active .stage-box{filter:drop-shadow(0 0 12px rgba(57,135,229,.6))}
.stage.active .ring-live{opacity:1;animation:haloPulse 1.3s ease-in-out infinite}
.ring-live{opacity:0}
.gate-ring{transform-origin:center;animation:gateSpin 14s linear infinite}
@keyframes gateSpin{to{transform:rotate(360deg)}}
.story .cap{font:650 12px system-ui,sans-serif;fill:#e8ebf2}
.story .sub{font:500 10.5px system-ui,sans-serif;fill:#6b7488}
.story .num{font:750 19px system-ui,sans-serif;letter-spacing:-.5px}
/* Short laptop screens: trade chrome for content. */
@media(max-height:860px){
  .kpi .value{font-size:18px}
  .kpi{padding:7px 11px}
  .flowwrap svg{max-height:250px}
  .view{padding-bottom:24px}
}
.nd rect{transition:all .4s}
.nd.run .halo{opacity:1;animation:haloPulse 1.2s ease-in-out infinite}
.nd.done .halo{opacity:.55}
.halo{opacity:0;transition:opacity .4s}
@keyframes haloPulse{0%,100%{opacity:.35}50%{opacity:1}}
.edge{stroke-dasharray:5 7;opacity:.3;transition:opacity .4s}
.edge.hot{opacity:1;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.spark{opacity:0}
.spark.go{opacity:1;animation:zip 1.1s linear infinite}
@keyframes zip{from{offset-distance:0%}to{offset-distance:100%}}

/* ============ agent log cards ============ */
.alog{display:flex;flex-direction:column;gap:7px}
.agent{
  position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:13px;align-items:start;
  background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:11px 14px;
  backdrop-filter:blur(14px);overflow:hidden;transition:.3s;
}
.agent::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--muted);
  opacity:.3;transition:.3s;
}
.agent.running{border-color:rgba(57,135,229,.5);box-shadow:0 0 26px rgba(57,135,229,.16)}
.agent.running::before{background:linear-gradient(180deg,#3987e5,#22d3ee);opacity:1}
.agent.done::before{background:var(--good);opacity:1}
.agent.failed::before{background:var(--critical);opacity:1}
.a-ico{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted);transition:.3s;
}
.agent.running .a-ico{
  background:linear-gradient(135deg,rgba(57,135,229,.3),rgba(34,211,238,.18));
  color:#7fc4f5;border-color:rgba(57,135,229,.5);box-shadow:0 0 18px rgba(57,135,229,.35);
}
.agent.running .a-ico span{display:block;animation:spin 1.4s linear infinite}
.agent.done .a-ico{background:rgba(12,163,12,.16);color:#5fc95f;border-color:rgba(12,163,12,.4)}
.agent.failed .a-ico{background:rgba(208,59,59,.16);color:#f08a8a;border-color:rgba(208,59,59,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
.a-name{font-weight:680;font-size:14px;letter-spacing:-.2px}
.a-goal{font-size:11.5px;color:var(--muted);margin-top:1px}
.a-out{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
.a-reason{
  font-size:11.5px;color:var(--ink2);margin-top:9px;padding:8px 11px;border-radius:9px;
  background:rgba(0,0,0,.28);border-left:2px solid rgba(57,135,229,.5);line-height:1.6;
}
.a-tools{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tool{
  font:10.5px ui-monospace,Menlo,Consolas,monospace;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,.05);color:var(--ink2);border:1px solid var(--line);
}
.tool.m{border-color:rgba(57,135,229,.4);color:#7fc4f5;background:rgba(57,135,229,.1)}
.a-time{font:11px ui-monospace,monospace;color:var(--muted);white-space:nowrap}

/* ============ chips ============ */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:10.5px;font-weight:680;border:1px solid transparent;white-space:nowrap;
}
.chip.critical{background:rgba(208,59,59,.17);color:#f49090;border-color:rgba(208,59,59,.42)}
.chip.high{background:rgba(236,131,90,.17);color:#f5a989;border-color:rgba(236,131,90,.42)}
.chip.medium{background:rgba(250,178,25,.15);color:#f8cb6a;border-color:rgba(250,178,25,.38)}
.chip.low{background:rgba(12,163,12,.15);color:#6ad06a;border-color:rgba(12,163,12,.38)}
.chip.neutral{background:rgba(255,255,255,.055);color:var(--ink2);border-color:var(--line)}
.chip.blue{background:rgba(57,135,229,.16);color:#8cc0f5;border-color:rgba(57,135,229,.4)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}

/* ============ split list/detail ============ */
/* 196px = header + KPI strip + nav + view heading. Keep in step with those. */
.split{display:grid;grid-template-columns:minmax(290px,400px) 1fr;gap:12px;height:calc(100vh - 196px);min-height:420px}
@media(max-width:1050px){.split{grid-template-columns:1fr;height:auto}}
.list{overflow-y:auto;padding-right:4px}
.detail{
  overflow-y:auto;background:var(--glass);border:1px solid var(--line);
  border-radius:14px;padding:18px;backdrop-filter:blur(14px);
}
.row{
  background:var(--glass);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:.18s;
}
.row:hover{border-color:var(--line2);background:var(--glass2);transform:translateX(3px)}
.row.on{
  border-color:rgba(57,135,229,.55);background:rgba(57,135,229,.1);
  box-shadow:0 0 18px rgba(57,135,229,.15);
}
.row-top{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.row-txt{font-size:12px;color:var(--ink2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ============ proof ============ */
.verdict{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;
  font-weight:750;font-size:13px;letter-spacing:.3px;
}
.verdict.pass{
  background:linear-gradient(135deg,rgba(12,163,12,.22),rgba(12,163,12,.08));
  color:#7ee07e;border:1px solid rgba(12,163,12,.5);box-shadow:0 0 22px rgba(12,163,12,.18);
}
.verdict.fail{background:rgba(208,59,59,.18);color:#f49090;border:1px solid rgba(208,59,59,.5)}
.offsets{
  display:flex;gap:18px;flex-wrap:wrap;padding:11px 14px;border-radius:11px;margin-bottom:14px;
  background:rgba(0,0,0,.3);border:1px solid var(--line);
}
.offsets div{display:flex;flex-direction:column;gap:2px}
.offsets .k{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
.offsets .v{font-family:ui-monospace,monospace;font-size:14px;font-weight:700;color:#8cc0f5}
.secn{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.85px;color:var(--muted);
  font-weight:750;margin:16px 0 7px;
}
.textbox{
  background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
}
.ctxbox{
  background:rgba(0,0,0,.34);border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;max-height:290px;overflow-y:auto;
}
.ctxbox .dim{color:#5a6276}
.hl{
  background:linear-gradient(180deg,rgba(250,178,25,.3),rgba(250,178,25,.16));
  color:#ffe9b0;border-radius:3px;box-shadow:0 0 0 1px rgba(250,178,25,.4),0 0 14px rgba(250,178,25,.2);
}
.hint{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.55}

/* ============ trace chain ============ */
.chain{display:flex;flex-direction:column}
.node{display:grid;grid-template-columns:38px 1fr;gap:14px;position:relative;padding-bottom:15px}
.node:not(:last-child)::before{
  content:"";position:absolute;left:18.5px;top:38px;bottom:0;width:2px;
  background:linear-gradient(180deg,rgba(57,135,229,.5),rgba(57,135,229,.1));
}
.n-ico{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:15px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);z-index:1;
  box-shadow:0 0 14px rgba(0,0,0,.4);
}
.n-body{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.n-kind{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:750}
.n-title{font-weight:680;font-size:13.5px;margin:3px 0 5px}
.n-txt{font-size:12px;color:var(--ink2);line-height:1.55}

.bar{height:6px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}

/* ============ simulate ============ */
.simrow{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.simrow input{
  flex:1;min-width:300px;padding:13px 16px;border-radius:12px;color:var(--ink);font:inherit;
  background:var(--glass);border:1px solid var(--line2);backdrop-filter:blur(10px);
}
.simrow input:focus{outline:none;border-color:var(--s1);box-shadow:0 0 0 3px rgba(57,135,229,.18)}
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.preset{
  padding:7px 14px;border-radius:999px;font-size:11.5px;color:var(--ink2);
  background:var(--glass);border:1px solid var(--line);transition:.18s;
}
.preset:hover{border-color:rgba(57,135,229,.5);color:#fff;background:rgba(57,135,229,.12)}
.preset.evon{
  background:linear-gradient(135deg,rgba(57,135,229,.26),rgba(144,133,233,.16));
  border-color:rgba(57,135,229,.55);color:#fff;font-weight:650;
  box-shadow:0 0 16px rgba(57,135,229,.22);
}
.finding:hover{border-color:var(--line2);transform:translateY(-2px)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{
  text-align:left;padding:9px 11px;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.7px;color:var(--muted);font-weight:750;border-bottom:1px solid var(--line);
}
td{padding:10px 11px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top;color:var(--ink2)}
tr:hover td{background:rgba(255,255,255,.03)}

.empty{text-align:center;padding:70px 20px;color:var(--muted);font-size:13px;line-height:1.7}
.empty .big{
  font-size:46px;margin-bottom:14px;opacity:.35;
  background:linear-gradient(135deg,#3987e5,#9085e9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.flexbet{display:flex;align-items:center;justify-content:space-between;gap:11px;flex-wrap:wrap}
.value.ok{color:#6ad06a}.value.warn{color:#f8cb6a}
.value.bad{color:#f49090}.value.info{color:#8cc0f5}
</style>
</head>
<body>
<canvas id="bg"></canvas>

/* ==================== particle field ==================== */
(function bgField(){
  const c = $('#bg'), x = c.getContext('2d');
  let w, h, pts = [], raf = null;
  const resize = () => {
    w = c.width = innerWidth * devicePixelRatio;
    h = c.height = innerHeight * devicePixelRatio;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    const n = Math.min(70, Math.floor(innerWidth / 24));
    pts = Array.from({length:n}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-.5)*.22*devicePixelRatio,
      vy: (Math.random()-.5)*.22*devicePixelRatio,
      r: (Math.random()*1.4+.6)*devicePixelRatio,
    }));
  };
  const draw = () => {
    x.clearRect(0,0,w,h);
    const link = 150*devicePixelRatio;
    for (let i=0;i<pts.length;i++){
      const p = pts[i];
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>w) p.vx*=-1;
      if(p.y<0||p.y>h) p.vy*=-1;
      for(let j=i+1;j<pts.length;j++){
        const q=pts[j], dx=p.x-q.x, dy=p.y-q.y, d=Math.hypot(dx,dy);
        if(d<link){
          x.strokeStyle=`rgba(90,140,220,${(1-d/link)*.16})`;
          x.lineWidth=devicePixelRatio*.6;
          x.beginPath(); x.moveTo(p.x,p.y); x.lineTo(q.x,q.y); x.stroke();
        }
      }
      x.fillStyle='rgba(130,170,235,.5)';
      x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();
    }
    raf = requestAnimationFrame(draw);
  };
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ cancelAnimationFrame(raf); raf=null; }
    else if(!raf) draw();
  });
  resize(); draw();
})();

/* ==================== config ==================== */

/* ==================== KPI gauges ==================== */
function ring(pct, color){
  const r = 14, C = 2*Math.PI*r;
  return `<svg width="34" height="34" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3.2"/>
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="${color}" stroke-width="3.2"
      stroke-linecap="round" stroke-dasharray="${C}"
      stroke-dashoffset="${C*(1-Math.max(0,Math.min(1,pct/100)))}"
      style="transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 5px ${color})"/>
  </svg>`;
}

/* Tiles are built once and then updated in place. Re-rendering the markup on
   every data load restarted the entrance animation and the count-up, which read
   as flicker and showed stale mid-animation numbers. */
const KPI_DEFS = [
  {id:'obl',  l:'Rules found',            ring:false},
  {id:'ver',  l:'Claims we can prove',    ring:true},
  {id:'cov',  l:'Rules you actually cover', ring:true},
  {id:'gaps', l:'Compliance gaps',        ring:false},
  {id:'conf', l:'Rules that contradict',  ring:false},
  {id:'rev',  l:'Sent to a human',        ring:false},
];

function buildKpis(){
  $('#kpis').innerHTML = KPI_DEFS.map((d,i) => `
    <div class="kpi" id="k-${d.id}" style="--kc:#6b7488;animation-delay:${i*55}ms">
      ${d.ring ? `<div class="ring" id="kr-${d.id}">${ring(0,'#6b7488')}<div class="rv">—</div></div>` : ''}
      <div class="meta">
        <div class="label">${d.l}</div>
        <div class="value" id="kv-${d.id}">—</div>
        <div class="note" id="kn-${d.id}">awaiting analysis</div>
      </div>
    </div>`).join('');
}

function updateKpis(s){
  const sev = s.severity || {}, crit = (sev.critical||0)+(sev.high||0);
  const cov = s.coverage_pct ?? 0, ver = s.verification_pct ?? 0;
  const vals = {
    obl:  {n:s.obligation??0, c:'#8cc0f5',
           note:`read from ${s.regulation??0} regulations`},
    ver:  {n:ver, suf:'%', c:ver===100?'#6ad06a':'#f8cb6a', pct:ver,
           rl:ver===100?'✓':Math.round(ver)+'%',
           note:ver===100?'nothing was invented':'some claims unproven'},
    cov:  {n:cov, suf:'%', c:cov>=50?'#6ad06a':cov>=25?'#f8cb6a':'#f49090', pct:cov,
           rl:Math.round(cov)+'%',
           note:`the rest are exposure`},
    gaps: {n:s.gap??0, c:crit>0?'#f49090':'#6ad06a',
           note:`${crit} need urgent action`},
    conf: {n:s.contradiction??0, c:(s.contradiction>0)?'#f8cb6a':'#6ad06a',
           note:'you cannot satisfy both'},
    rev:  {n:s.needs_review??0, c:(s.needs_review>0)?'#f8cb6a':'#6ad06a',
           note:'nothing dropped silently'},
  };
  for(const [id,v] of Object.entries(vals)){
    const tile = $('#k-'+id); if(!tile) continue;
    tile.style.setProperty('--kc', v.c);
    $('#kn-'+id).textContent = v.note;
    const r = $('#kr-'+id);
    if(r){
      r.innerHTML = ring(v.pct??0, v.c) + `<div class="rv">${v.rl||''}</div>`;
    }
    countTo($('#kv-'+id), v.n, v.suf||'');
  }
}

function countTo(el, target, suffix){
  if(!el) return;
  const settle = () => { el.textContent = target + suffix; };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const from = parseFloat(el.textContent) || 0;
  if(reduce || from === target) return settle();

  const dec = String(target).includes('.') ? 1 : 0;
  let t0 = null;
  const step = ts => {
    if(!t0) t0 = ts;
    const k = Math.min(1,(ts-t0)/850), e = 1-Math.pow(1-k,3);
    el.textContent = (from + (target-from)*e).toFixed(dec) + suffix;
    if(k<1) requestAnimationFrame(step); else settle();
  };
  requestAnimationFrame(step);
  // Safety net: if rAF is throttled (background tab, headless capture) the
  // tile must still end on the true value rather than a mid-animation number.
  clearTimeout(el._ct); el._ct = setTimeout(settle, 950);
}

/* ==================== flow graph ==================== */
const CW = 208, CH = 74, NW = 174, NH = 54, PADX = 32, PADY = 16;
const nx = col => PADX + col*CW;
const ny = row => PADY + row*CH;

/* `live` wires ids for state updates. The architecture view passes false so it
   renders a static process diagram — reusing live ids there would duplicate
   them in the document and leave those nodes stuck on their initial state. */
function flowGraph(live = true){
  const w = PADX*2 + 4*CW + NW - 40, h = PADY*2 + 3*CH;
  const pos = {};
  NODES.forEach(([id,,,c,r]) => pos[id] = {x:nx(c), y:ny(r)});

  const edges = EDGES.map(([a,b]) => {
    const p = pos[a], q = pos[b];
    const x1 = p.x+NW, y1 = p.y+NH/2, x2 = q.x, y2 = q.y+NH/2;
    const mx = (x1+x2)/2;
    const d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    return `<path class="edge" ${live?`id="e-${a}-${b}"`:''} d="${d}" fill="none"
      stroke="url(#eg)" stroke-width="1.8"/>
      ${live?`<circle class="spark" id="s-${a}-${b}" r="3.2" fill="#22d3ee"
        style="offset-path:path('${d}');filter:drop-shadow(0 0 6px #22d3ee)"/>`:''}`;
  }).join('');

  const nodes = NODES.map(([id,label,short]) => {
    const p = pos[id];
    return `<g class="nd" ${live?`id="n-${id}"`:''} transform="translate(${p.x},${p.y})">
      ${live?`<rect class="halo" x="-4" y="-4" width="${NW+8}" height="${NH+8}" rx="15"
        fill="none" stroke="#3987e5" stroke-width="2" opacity="0"/>`:''}
      <rect class="bx" width="${NW}" height="${NH}" rx="12"
        fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
      <text x="14" y="23" fill="#f2f4f8" font-size="12.5" font-weight="650"
        font-family="system-ui,sans-serif">${ICONS[id]} ${label}</text>
      <text x="14" y="40" fill="#6b7488" font-size="10.5"
        font-family="system-ui,sans-serif">${short}</text>
      ${live?`<circle class="sdot" cx="${NW-14}" cy="19" r="3.5" fill="#3d4456"/>
      <text class="st" x="${NW-14}" y="39" fill="#6b7488" font-size="9" text-anchor="end"
        font-family="ui-monospace,monospace" letter-spacing=".4">idle</text>`:''}
    </g>`;
  }).join('');

  return `<div class="flowwrap"><div class="flowscroll">
    <svg viewBox="0 0 ${w} ${h}" style="min-width:${w}px">
      <defs><linearGradient id="eg" x1="0" x2="1">
        <stop offset="0" stop-color="#3987e5"/><stop offset="1" stop-color="#9085e9"/>
      </linearGradient></defs>
      ${edges}${nodes}
    </svg></div></div>`;
}

function setNode(id, state, label){
  const g = document.getElementById('n-'+id); if(!g) return;
  g.classList.remove('run','done','fail');
  if(state) g.classList.add(state);
  const col = state==='done' ? '#6ad06a' : state==='run' ? '#22d3ee'
    : state==='fail' ? '#f49090' : '#6b7488';
  const st = g.querySelector('.st');
  if(st){ st.textContent = label || state || ''; st.setAttribute('fill', col); }
  const dot = g.querySelector('.sdot');
  if(dot){
    dot.setAttribute('fill', state ? col : '#3d4456');
    dot.setAttribute('style', state==='run' ? `filter:drop-shadow(0 0 6px ${col})` : '');
  }
  const bx = g.querySelector('.bx');
  if(bx){
    bx.setAttribute('stroke', state==='done' ? 'rgba(12,163,12,.55)'
      : state==='run' ? 'rgba(57,135,229,.8)' : state==='fail' ? 'rgba(208,59,59,.6)'
      : 'rgba(255,255,255,.12)');
    bx.setAttribute('fill', state==='run' ? 'rgba(57,135,229,.14)'
      : state==='done' ? 'rgba(12,163,12,.07)' : 'rgba(255,255,255,.045)');
  }
}
function flowEdges(id, on){
  EDGES.filter(([a]) => a===id).forEach(([a,b]) => {
    document.getElementById(`e-${a}-${b}`)?.classList.toggle('hot', on);
    document.getElementById(`s-${a}-${b}`)?.classList.toggle('go', on);
  });
}

/* ==================== narrative flow hero ====================
   Reads left to right: what goes in, what the system does to it, what comes
   out. The verification gate sits at the centre because it is the step that
   makes every downstream claim checkable. Counts are live. */
const SY = 104;                      // vertical centre of the artefact row
const SX = [84, 308, 532, 756, 980]; // stage centres

function stream(x1, x2, seed){
  const lanes = 7, perLane = 3, out = [], paths = [];
  for(let i=0;i<lanes;i++){
    const spread = (i - (lanes-1)/2) * 11.5;
    const y1 = SY + spread*0.42, y2 = SY + spread;
    const mx = (x1+x2)/2;
    paths.push(`M${x1},${y1} C${mx-24},${y1} ${mx+24},${y2} ${x2},${y2}`);
  }
  // Rails first so every particle rides above them.
  paths.forEach(d => out.push(
    `<path d="${d}" fill="none" stroke="url(#sg)" stroke-width="1" opacity=".26"/>`));

  paths.forEach((d,i) => {
    for(let k=0;k<perLane;k++){
      const n = i + k*lanes + seed*5;
      const dur = (2.3 + (i%4)*0.22).toFixed(2);
      const dly = -(((i*0.31)+(k*dur/perLane)+seed*0.13) % dur).toFixed(2);
      const fill = ['#3987e5','#22d3ee','#199e70','#9085e9','#6aa9f0'][n%5];
      const style = `offset-path:path('${d}');--dly:${dly}s;--dur:${dur}s`;
      out.push(n%3===0
        ? `<rect class="pdot" x="-3.2" y="-3.2" width="6.4" height="6.4" rx="1.6"
             fill="${fill}" style="${style}"/>`
        : `<circle class="pdot" r="${n%4===1?3:2.3}" fill="${fill}" style="${style}"/>`);
    }
  });
  return out.join('');
}

function narrativeFlow(){
  const s = STATS || {};
  const n = k => (s[k] != null ? s[k] : '—');
  const stages = [
    ['Regulations',  `${n('regulation')} documents`,    '#8cc0f5', n('reg_section')+' clauses parsed', docStack],
    ['Obligations',  `${n('obligation')} extracted`,    '#9085e9', 'actor · action · deadline',        chipStack],
    ['Verified to source', `${s.verification_pct ?? '—'}% provable`, '#22d3ee', 're-sliced from the original', gate],
    ['Bank controls',`${n('control')} mapped`,          '#6ad06a', 'graded by last test result',       controlGrid],
    ['Gaps & fixes', `${n('gap')} prioritised`,         '#f49090', 'impact × likelihood',              gapCard],
  ];

  const art = stages.map(([t,,col,,draw],i) => `
    <g class="stage" id="st-${i}">
      <circle class="ring-live" cx="${SX[i]}" cy="${SY}" r="64" fill="none"
        stroke="${col}" stroke-width="1" opacity="0"/>
      <g class="stage-box">${draw(SX[i])}</g>
    </g>`).join('');

  const flows = SX.slice(0,-1).map((x,i) =>
    `<g>${stream(x+64, SX[i+1]-64, i)}</g>`).join('');

  const labels = stages.map(([title,metric,col,sub],i) => `
    <text class="cap" x="${SX[i]}" y="200" text-anchor="middle">${title}</text>
    <text class="num" x="${SX[i]}" y="223" text-anchor="middle" fill="${col}">${metric}</text>
    <text class="sub" x="${SX[i]}" y="240" text-anchor="middle">${sub}</text>`).join('');

  return `<div class="story"><div class="inner">
    <svg viewBox="0 0 1064 256" preserveAspectRatio="xMidYMid meet">
      <defs>

const AGENT_STAGE = {

  MappingAgent:3, GapAgent:4, ContradictionAgent:4, ChangeAgent:0, SimulationAgent:4,
};

/* ==================== findings ====================
   Derived from the live run, not hardcoded. Each one states the problem in
   business terms and links to the evidence that proves it. */
function deriveFindings(){
  const out = [];
  const gaps = DATA.gaps || [], conflicts = DATA.conflicts || [];
  const controls = DATA.controls || [], changes = DATA.changes || [];

  // 1. A control the bank's OWN testing says is failing.
  // Among equally-failing controls, lead with one whose evidence carries a
  // hard number — "11.4 days against 7" lands harder than a vague finding.
  const quantified = e => /\d/.test(e?.evidence_ref || '') ? 0 : 1;
  const failing = controls
    .filter(c => (c.effectiveness ?? 1) < 0.5)
    .sort((a,b) => (a.effectiveness??0) - (b.effectiveness??0)
                   || quantified(a) - quantified(b))[0];
  if(failing){
    const dependents = gaps.filter(g => g.control_ref === failing.control_ref).length;
    out.push({
      tone:'critical',
      headline:`${failing.title} is failing its own test`,
      detail:`The bank's latest test of ${failing.control_ref} returned “${failing.test_result}”. `
        + `Its own evidence reads: ${failing.evidence_ref || 'no evidence on file'}.`,
      impact:`${dependents} requirement${dependents===1?'':'s'} depend${dependents===1?'s':''} on this control.`,
      cta:'Show the failing control', go:['evidence','controls'],
    });
  }

  // 2. Two regulators demanding incompatible things. Prefer a cross-regulation
  //    clash, then a short operational deadline over a multi-year retention
  //    period — a 3-vs-7-day filing rule bites sooner than 5-vs-10 years.
  const rank = c => (c.regulation_a !== c.regulation_b ? 0 : 10)
    + ({critical:0, high:1, medium:2}[c.severity] ?? 3)
    + (/\b\d+ days?\b/.test(c.explanation||'') ? 0 : 4);
  const xreg = [...conflicts].sort((a,b) => rank(a) - rank(b))[0];
  if(xreg){
    const subject = (xreg.explanation||'')
      .split(/ (?:across regulations|within the same regulation)/)[0]
      .trim() || 'Two rules';
    out.push({
      tone: xreg.severity==='critical' ? 'critical' : 'high',
      headline:`${subject}: the two regulations disagree`,
      detail:xreg.explanation,
      impact:'A system configured to one rule is in breach of the other.',
      cta:'Show the conflict', go:['evidence','conflicts'],
    });
  }

  // 3. Requirements with no control whatsoever.
  const naked = gaps.filter(g => g.gap_type === 'no_control');
  const urgent = naked.filter(g => ['critical','high'].includes(g.severity));
  if(naked.length){
    out.push({
      tone: urgent.length ? 'critical' : 'medium',
      headline:`${naked.length} requirements have no control at all`,
      detail:`Nothing in the bank's control framework addresses them — not a weak control, `
        + `none. ${urgent.length} carry critical or high regulatory risk.`,
      impact:'Each is an unmitigated finding if a regulator inspects tomorrow.',
      cta:'Show the gaps', go:['evidence','gaps'],
    });
  }

  // 4. A rule that tightened and may have left controls stale.
  const tightened = changes.find(c => c.impact_level==='high' && /→/.test(c.summary||''));
  if(tightened){
    out.push({
      tone:'medium',
      headline:'A regulation tightened since your last review',
      detail:tightened.summary,
      impact:`Affects ${tightened.affected_count} requirement${tightened.affected_count===1?'':'s'}. `
        + 'Any control still configured to the old number is now non-compliant.',
      cta:'Show what changed', go:['evidence','changes'],
    });
  }
  return out;
}

/* ==================== run ==================== */
function runPipeline(){
  if(running) return;
  running = true;
  $('#runBtn').disabled = true;
  $('#runBtn').textContent = '◉ Running…';
  show('how');                       // the agents are on screen 3
  $('#runBadge').style.display = ''; $('#runBadge').classList.add('live');

  const es = new EventSource('/api/run');
  es.onmessage = ev => {
    const e = JSON.parse(ev.data);
    const card = e.agent ? $('#ag-'+e.agent) : null;

    if(e.event==='start' && card){
      card.className = 'agent running';
      setNode(e.agent,'run','running'); flowEdges(e.agent,true);
      if(AGENT_STAGE[e.agent]!=null) setStage(AGENT_STAGE[e.agent], true);
      $('#runTxt').textContent = e.agent;
      card.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    if(e.event==='progress' && card)
      $('#out-'+e.agent).innerHTML = `<span class="chip neutral">${esc(e.message||'')}</span>`;

    if((e.event==='done'||e.event==='summary') && card){
      if(e.event==='done'){
        card.className='agent done';
        setNode(e.agent,'done','done'); flowEdges(e.agent,false);
        if(AGENT_STAGE[e.agent]!=null) setStage(AGENT_STAGE[e.agent], false);
        if(e.agent==='ObligationAgent') setStage(2, true);
      }
      const bits = Object.entries(e).filter(([k]) =>
        !['event','agent','stage','duration_ms','message'].includes(k));
      if(bits.length) $('#out-'+e.agent).innerHTML = bits.map(([k,v]) =>
        `<span class="chip ${k==='rejected'&&v>0?'high':k==='recovered'&&v>0?'medium':
          /pct|audit/.test(k)?'low':'neutral'}">${k.replace(/_/g,' ')}: <b>${v}</b></span>`).join('');
      if(e.duration_ms!=null) $('#tm-'+e.agent).textContent = e.duration_ms+' ms';
    }
    if(e.event==='failed' && card){
      card.className='agent failed'; setNode(e.agent,'fail','failed'); flowEdges(e.agent,false);
      $('#out-'+e.agent).innerHTML = `<span class="chip critical">${esc(e.error||'failed')}</span>`;
    }
    if(e.event==='complete'){ es.close(); finish(e); }
    if(e.event==='error'){ es.close(); finish(null,e.error); }
  };
  es.onerror = () => { es.close(); finish(null,'stream interrupted'); };
}

async function finish(stats, err){
  running = false;
  $('#runBtn').disabled = false;
  $('#runBtn').textContent = '▶  Re-run Analysis';
  $('#runBadge').classList.remove('live');
  $('#runTxt').textContent = err ? 'error' : 'complete';
  NODES.forEach(([id]) => flowEdges(id,false));
  [0,1,2,3,4].forEach(i => setStage(i,false));
  if(err){ alert('Pipeline error: '+err); return; }
  await loadAll();
  renderFindings();                  // refresh the headline with this run's numbers
  (DATA.runs||[]).forEach(r => {
    const rsn = $('#rsn-'+r.agent_name), tls = $('#tls-'+r.agent_name);
    if(rsn && r.reasoning){ rsn.style.display=''; rsn.textContent = r.reasoning; }
    if(tls){
      let tools=[]; try{ tools = JSON.parse(r.tool_calls||'[]'); }catch{}
      tls.innerHTML = tools.map(t => `<span class="tool">${esc(t)}()</span>`).join('')
        + (r.model ? `<span class="tool m">${esc(r.model)}</span>` : '');
    }
  });
}

function traceChain(t){
  const ob=t.obligation, map=(t.mapping||[])[0], gap=(t.gaps||[])[0], ev=t.evidence||[];
  const n=[];
  n.push(['◈','Regulation',ob.regulation_title,
    `${ob.regulator} · clause ${ob.clause_path} · page ${ob.page_no??'—'}`]);
  n.push(['◆','Obligation',`${ob.risk_tier} risk · ${ob.category||'general'}`,
    (ob.obligation_text||'').trim().slice(0,200)]);
  n.push(map&&map.control_ref
    ? ['▣','Mapped control',`${map.control_ref} — ${map.title||''}`,
       `${map.rationale||''} Owner: ${map.owner||'—'}.`]
    : ['▣','Mapped control','No control found',
       'No control in the bank framework addresses this obligation.']);
  if(ev.length) n.push(['▤','Evidence',ev[0].reference,
    `Status: ${ev[0].status}. Captured ${ev[0].captured_on||'—'}. ${ev[0].note||''}`]);
  if(gap){
    n.push(['△',`Gap — ${gap.severity}`,`risk score ${(gap.risk_score??0).toFixed(2)}`,gap.rationale||'']);
    if(gap.action) n.push(['✦','Remediation',
      `${gap.owner_role||'—'} · ${gap.effort||'—'} effort · due in ${gap.due_days}d`,gap.action]);
  } else n.push(['✓','No gap','Covered by an effective control','']);
  return `<div class="chain">${n.map(([i,k,title,txt]) => `
    <div class="node"><div class="n-ico">${i}</div>
      <div class="n-body"><div class="n-kind">${esc(k)}</div>
        <div class="n-title">${esc(title)}</div>
        ${txt?`<div class="n-txt">${esc(txt)}</div>`:''}</div></div>`).join('')}</div>`;
}

      <div class="card" style="border-left:3px solid ${c.severity==='critical'?'var(--critical)':'var(--serious)'};animation:rise .4s backwards;animation-delay:${i*70}ms">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap">
          <span class="chip ${c.severity}">⚡ ${esc(c.severity)}</span>
          <span class="chip neutral">${esc(c.conflict_type.replace(/_/g,' '))}</span>
          <span class="chip blue">confidence ${(c.confidence*100).toFixed(0)}%</span>
        </div>
        <div style="font-size:13.5px;line-height:1.65;margin-bottom:13px">${esc(c.explanation)}</div>
        <div class="grid2">
          <div style="background:rgba(0,0,0,.26);border:1px solid var(--line);border-radius:11px;padding:11px 13px">
            <div class="n-kind">${esc(c.regulation_a)} · ${esc(c.clause_a)}</div>
            <div style="font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.55">${esc((c.text_a||'').trim())}</div>
          </div>
          <div style="background:rgba(0,0,0,.26);border:1px solid var(--line);border-radius:11px;padding:11px 13px">
            <div class="n-kind">${esc(c.regulation_b)} · ${esc(c.clause_b)}</div>
            <div style="font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.55">${esc((c.text_b||'').trim())}</div>
          </div>
        </div>
      </div>`).join('')}`;
}

/* ==================== changes ==================== */
function renderChanges(el){
  const list = DATA.changes||[];
  if(!list.length) return el.innerHTML = emptyState();
  const high = list.filter(c => c.impact_level==='high');
  el.innerHTML = `
    <p class="hint" style="margin:0 0 11px">What changed since the previous version of the rules.
      Changes that move a <b>number</b> — a deadline, a threshold, a percentage — are the
      dangerous ones: any system still set to the old value is now breaking the rule.</p>
    <div style="margin-bottom:13px;display:flex;gap:7px;flex-wrap:wrap">
      <span class="chip critical">▲ ${high.length} high impact</span>
      <span class="chip neutral">${list.length} total changes</span>
    </div>
    <div class="card"><table>
      <thead><tr><th>Clause</th><th>Type</th><th>What changed</th><th>Affects</th></tr></thead>
      <tbody>${list.map(c => `<tr>
        <td class="mono" style="font-weight:700;color:${c.impact_level==='high'?'#f5a989':'var(--ink2)'}">${esc(c.clause_path)}</td>
        <td><span class="chip ${c.change_type==='added'?'blue':c.change_type==='removed'?'critical':'medium'}">${esc(c.change_type)}</span></td>
        <td style="color:var(--ink)">${esc(c.summary)}</td>
        <td><span class="chip ${c.affected_count>0?'medium':'neutral'}">${c.affected_count}</span></td>
      </tr>`).join('')}</tbody></table></div>`;
}

/* ==================== simulate ==================== */
const PRESETS = [
  'RBI tightens the STR filing deadline from 7 days to 3 days',
  'Beneficial ownership threshold reduced from 25 percent to 10 percent',
  'Record retention extended to ten years for all customer transactions',
  'Enhanced due diligence required for all non-resident customers',
];
function renderSimulate(el){
  el.innerHTML = `
    <p class="hint" style="margin:0 0 11px">Ask “what if a rule changed?” and Accentic traces
      which requirements, which controls and which existing gaps that change would touch —
      before it happens.</p>
    <div class="simrow">
      <input id="simIn" placeholder="e.g. RBI tightens the STR filing deadline to 3 days" />
      <button class="run-btn" id="simGo">Simulate</button>
    </div>
    <div class="presets">${PRESETS.map(p => `<button class="preset">${esc(p)}</button>`).join('')}</div>
    <div id="simOut"></div>`;
  el.querySelectorAll('.preset').forEach(b => b.onclick = () => { $('#simIn').value=b.textContent; runSim(); });
  $('#simGo').onclick = runSim;
  $('#simIn').onkeydown = e => { if(e.key==='Enter') runSim(); };
}
async function runSim(){
  const scenario = $('#simIn').value.trim(); if(!scenario) return;
  $('#simOut').innerHTML = '<div class="empty">Tracing impact across the obligation graph…</div>';
  const r = await api('/api/simulate',{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario})});
  const s = r.summary||{}, rows = r.impact||[];
  if(!rows.length) return $('#simOut').innerHTML = `<div class="empty"><div class="big">○</div>
    No obligations matched that scenario. Try naming a subject such as suspicious
    transactions, retention, beneficial ownership, or risk categorisation.</div>`;
  $('#simOut').innerHTML = `
    <div class="grid3" style="margin-bottom:16px">
      ${[['Obligations affected',s.affected,'info'],['Controls to revisit',s.controls,'warn'],
         ['Already uncovered',s.uncovered,'bad']].map(([l,v,c]) => `
        <div class="card"><div class="label" style="font-size:9.5px;text-transform:uppercase;letter-spacing:.85px;color:var(--muted);font-weight:700">${l}</div>
        <div class="value ${c}" style="font-size:30px;font-weight:750;margin-top:3px">${v}</div></div>`).join('')}
    </div>
    <div class="card"><table>
      <thead><tr><th>Clause</th><th>Risk</th><th>Obligation</th><th>Coverage</th><th>Control</th></tr></thead>
      <tbody>${rows.map(i => `<tr>
        <td class="mono" style="font-weight:700;color:#8cc0f5">${esc(i.clause_path)}</td>
        <td><span class="chip ${i.risk_tier==='high'?'critical':i.risk_tier==='medium'?'medium':'low'}">${esc(i.risk_tier)}</span></td>
        <td>${esc(i.excerpt.trim())}</td>
        <td><span class="chip ${i.coverage==='none'?'critical':i.coverage==='partial'?'medium':'low'}">${esc(i.coverage)}</span></td>
        <td class="mono">${esc(i.control_ref||'—')}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ==================== architecture ==================== */
const FEATURES = [
  ['Regulatory intelligence &amp; ingestion','IngestionAgent','reg_section'],
  ['Regulatory change intelligence','ChangeAgent','reg_change'],
  ['Regulatory obligation extraction','ObligationAgent','obligation'],
  ['Bank control-framework understanding','ControlAgent','control'],
  ['Regulatory-to-control mapping','MappingAgent','mapping'],
  ['Control effectiveness assessment','ControlAgent',null],
  ['Evidence-based compliance assessment','ControlAgent','evidence'],
  ['Gap identification','GapAgent','gap'],
  ['Risk-based gap prioritisation','GapAgent',null],
  ['Remediation recommendation engine','GapAgent','remediation'],
  ['Autonomous regulatory impact analysis','ChangeAgent',null],
  ['What-if / simulation capability','SimulationAgent',null],
  ['Cross-regulation intelligence','ContradictionAgent','regulation'],
  ['Regulatory contradiction detection','ContradictionAgent','contradiction'],
];
const MODEL_SPLIT = [
  ['Obligation identification','claude','Needs language understanding; genuinely ambiguous'],
  ['Offset computation','python','Must be exact — never delegated to a model'],
  ['Quote verification','python','The checker must be independent of what it checks'],
  ['Control parsing','python','Structured document; rules are more reliable'],
  ['Obligation → control mapping','python','Deterministic, explainable, auditable'],
  ['Risk scoring','python','A regulator must reproduce the number'],
  ['Contradiction detection','python','Numeric comparison must not be probabilistic'],
];

function renderArchitecture(el){
  const s = STATS||{};
  const val = k => (s[k]!=null ? s[k] : '—');
  el.innerHTML = `
    <div class="secn" style="margin-top:20px">Design &amp; evidence</div>
    <div class="card" style="border-color:rgba(57,135,229,.4);background:linear-gradient(135deg,rgba(57,135,229,.1),rgba(144,133,233,.04))">
      <div class="n-kind" style="margin-bottom:7px">The core architectural decision</div>
      <div style="font-size:13.5px;line-height:1.7;color:var(--ink2)">
        Two responsibilities usually conflated are kept strictly apart: a model may decide
        <b style="color:#fff">what</b> is an obligation, but <b style="color:#fff">where</b> it
        exists is computed by Python searching the source. The stored text is always a slice of
        the original document, never the model's transcription. A quote that cannot be located is
        treated as a hallucination — rejected, retried, then quarantined for a human. This makes
        hallucination a <b style="color:#fff">measured quantity</b>, not a disclaimed risk.
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="n-kind" style="margin-bottom:10px">Where AI is used — and where it is not</div>
        <table><tbody>${MODEL_SPLIT.map(([stage,who,why]) => `
          <tr><td style="width:38%;color:var(--ink)">${stage}</td>
          <td style="width:17%"><span class="chip ${who==='claude'?'blue':'neutral'}">${who==='claude'?'Claude':'Python'}</span></td>
          <td style="font-size:11.5px">${why}</td></tr>`).join('')}</tbody></table>
        <div class="hint"><span class="mono">claude-opus-5-5</span>, adaptive thinking, effort
          medium. Runs end-to-end on the rule engine when no key is present.</div>
      </div>
      <div class="card">
        <div class="n-kind" style="margin-bottom:10px">Declared position — D2 / F3</div>
        ${blockerGrid()}
        <div style="font-size:12px;color:var(--ink2);line-height:1.65;margin-top:12px">
          <b style="color:#fff">F3</b> — all 14 features implemented (≥8 required).<br>
          <b style="color:#fff">D2</b> — textual and structured input with high
          <i>demonstrable</i> reliability.<br>
          <span style="color:var(--muted)">Not D3: we accept PDF and text, but not scanned images,
          OCR, or embedded tables. Claiming D3 would be overestimation — the honest gap is a
          layout-aware ingestion front-end; the offset contract already generalises to it.</span>
        </div>
      </div>
    </div>

    <div class="secn">Reliability evidence — measured this run</div>
    <div class="grid3">${[
      ['Section offset audit',`${val('reg_section')}/${val('reg_section')}`,'100%','ok','Every section re-sliced and compared'],
      ['Obligation verification',`${val('verified_obligations')}/${val('obligation')}`,(s.verification_pct??0)+'%',(s.verification_pct===100?'ok':'warn'),'Independently re-sliced at read time'],
      ['Quarantined for review',val('needs_review'),'human queue',(s.needs_review>0?'warn':'ok'),'Nothing is dropped silently'],
    ].map(([label,big,sub,cls,note]) => `
      <div class="card"><div class="n-kind">${label}</div>
        <div class="value ${cls}" style="font-size:29px;font-weight:750;margin:4px 0">${big}</div>
        <span class="chip ${cls==='ok'?'low':'medium'}">${sub}</span>
        <div class="hint">${note}</div></div>`).join('')}</div>

    <div class="secn">Feature coverage — 14 of 14</div>
    <div class="card"><table>
      <thead><tr><th style="width:36px">#</th><th>Feature</th><th>Owning agent</th><th>Live</th></tr></thead>
      <tbody>${FEATURES.map(([name,agent,key],i) => `
        <tr><td class="mono" style="color:var(--muted)">${i+1}</td>
        <td style="color:var(--ink)">${name}</td>
        <td><span class="chip neutral">${agent}</span></td>
        <td>${key?`<span class="chip low">✓ ${val(key)}</span>`:'<span class="chip low">✓ active</span>'}</td>
        </tr>`).join('')}</tbody></table></div>

    <div class="secn">Not built — stated to avoid overestimation</div>
    <div class="card"><div style="font-size:12.5px;color:var(--ink2);line-height:1.9">
      • OCR, scanned-document and table ingestion — this is the D3 gap.<br>
      • Live regulator feed polling; change intelligence diffs a supplied prior version.<br>
      • Authentication, multi-tenancy, remediation workflow state transitions.<br>
      • The RBI fixture is representative sample text; the pipeline is source-agnostic and runs
        unchanged against the official PDF placed in <span class="mono">data/regulations/</span>.
    </div></div>`;
}

function blockerGrid(){
  const cells=[];
  for(const d of ['D3','D2','D1']) for(const f of ['F1','F2','F3']){
    const on = (d==='D2'&&f==='F3');
    cells.push(`<div style="aspect-ratio:1.9;display:grid;place-items:center;border-radius:9px;
      font-size:11px;font-weight:700;border:1px solid ${on?'rgba(57,135,229,.7)':'var(--line)'};
      background:${on?'linear-gradient(135deg,rgba(57,135,229,.3),rgba(144,133,233,.18))':'rgba(255,255,255,.03)'};
      color:${on?'#bcd9f8':'var(--muted)'};${on?'box-shadow:0 0 20px rgba(57,135,229,.35)':''}">
      ${on?'◆ '+d+'/'+f:d+'/'+f}</div>`);
  }
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${cells.join('')}</div>`;
}

/* ==================== evidence (screen 2) ==================== */
function renderEvidence(){
  const el = $('#v-evidence');
  el.innerHTML = `
    <h2 class="vh">See the proof</h2>
    <p class="vs">Every number above resolves to text in a real document. Pick any item and
      Accentic re-slices the original regulation at the exact character range it recorded,
      so you can check it yourself.</p>
    <div class="presets" style="margin-bottom:14px">${EV.map(([id,label,key]) => {
      const n = key && STATS[key] != null ? ` <b style="opacity:.75">${STATS[key]}</b>` : '';
      return `<button class="preset ev${evMode===id?' evon':''}" data-ev="${id}">${label}${n}</button>`;
    }).join('')}</div>
    <div id="evBody"></div>
    <div id="evStep"></div>`;

  el.querySelectorAll('.ev').forEach(b => b.onclick = () => {
    evMode = b.dataset.ev; renderEvidence();
  });
  EV_RENDER[evMode]?.($('#evBody'));
  $('#evStep').innerHTML = stepNav(1);
}

/* ==================== how it works (screen 3) ==================== */
function renderHow(){
  const el = $('#v-how');
  el.innerHTML = `
    <h2 class="vh">How it works</h2>
    <p class="vs">Eight agents run the chain end to end. Each logs what it decided, which
      tools it called, and whether it had to recover from a result it could not verify.</p>
    <div id="howPipe"></div>
    <div id="howArch"></div>
    <div id="howStep"></div>`;
  pipelineShell($('#howPipe'));
  renderArchitecture($('#howArch'));
  $('#howStep').innerHTML = stepNav(2);
}

function emptyState(){
  return `<div class="empty"><div class="big">◇</div>
    No analysis yet.<br>Press <b style="color:var(--ink)">Run Analysis</b> to execute the agent pipeline.</div>`;
}

const EV_RENDER = {
  gaps:renderGaps, obligations:renderObligations, controls:renderControls,
  conflicts:renderConflicts, changes:renderChanges, simulate:renderSimulate,
};
const RENDER = {
  findings:renderFindings, evidence:renderEvidence, how:renderHow,
};

/* ==================== boot ==================== */
(async function init(){
  buildKpis(); renderTabs();
  $('#runBtn').onclick = runPipeline;
  try{
    const s = await api('/api/status');
    const claude = s.mode==='claude';
    $('#modeBadge').className = 'badge'+(claude?' live':'');
    $('#modeTxt').textContent = claude ? 'Claude Opus 5.5' : 'Rule engine (no API key)';
    if(s.obligation>0){
      await loadAll();
      renderFindings();
      const want = new URLSearchParams(location.search).get('tab');
      if(want && TABS.some(([t]) => t===want)) show(want, false);
      DATA.runs?.forEach(r => setNode(r.agent_name,'done','done'));
      (DATA.runs||[]).forEach(r => {
        const rsn=$('#rsn-'+r.agent_name), tls=$('#tls-'+r.agent_name), out=$('#out-'+r.agent_name);
        const card=$('#ag-'+r.agent_name);
        if(card) card.className='agent done';
        if(out && r.output_summary) out.innerHTML=`<span class="chip low">${esc(r.output_summary)}</span>`;
        if(rsn && r.reasoning){ rsn.style.display=''; rsn.textContent=r.reasoning; }
        if(tls){
          let tools=[]; try{ tools=JSON.parse(r.tool_calls||'[]'); }catch{}
          tls.innerHTML = tools.map(t=>`<span class="tool">${esc(t)}()</span>`).join('')
            + (r.model?`<span class="tool m">${esc(r.model)}</span>`:'');
        }
      });
    }
  }catch{ $('#modeTxt').textContent='offline'; }
})();
</script>
